<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-STAR 업무·학사 캘린더</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ───────── 토큰 ─────────
   🔴 크림슨은 「급함」 하나만 뜻한다.
      이전 버전은 오늘·급한 D-day·지난 마감·졸업사정 카테고리·주요 버튼·브랜드를
      전부 크림슨으로 칠했다. 뜻이 여섯 개가 되니 눈이 급한 것을 못 골라냈다.
      카테고리는 왼쪽 색 막대로만 표시하고, 크림슨은 시간 압박에만 쓴다. */
:root{
  --page:#eef0f2;  --card:#fff;   --sunk:#f7f8f9;  --sunk2:#eaedf0;
  /* 카드마다 종이를 달리한다. 채도는 거의 0 — 알록달록해지면 애써 정리한 것이 도로 무너진다.
     가장 자주 보는 목록이 제일 밝다. */
  --pa-list:#ffffff;   --pa-cal:#fafbfc;   --pa-look:#fcfbf9;   --pa-strip:#f8f9fa;
  --ink:#16181a;   --ink2:#5b6167; --mute:#8b9198;
  --line:#e4e7ea;  --line2:#eef0f2;
  --ku:#8b1f2f;    --ku-d:#6a1524; --ku-tint:#fdf1f2;
  --ok:#1f7a4d;    --ok-tint:#f0f8f3;
  --r:10px;
  --mono:'Pretendard Variable',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.6;font-feature-settings:'tnum' 1;}
.wrap{max-width:1300px;margin:0 auto;padding:22px 20px 60px;}
@media(max-width:640px){.wrap{padding:14px 12px 44px;}}
a{color:inherit;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ku);outline-offset:2px;border-radius:4px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;}
.card.p-list {background:var(--pa-list);}
.card.p-cal  {background:var(--pa-cal);}
.card.p-look {background:var(--pa-look);border-color:#eae6df;}
.card.p-strip{background:var(--pa-strip);}
.card.p-cal .pl{background:#fff;}
.card.p-look .lrow button{background:#fff;}
.hd{display:flex;align-items:center;gap:10px;padding:13px 18px 0;flex-wrap:wrap;}
.hd h2{font-size:14px;font-weight:700;margin:0;letter-spacing:-.01em;}
.hd .n{font-size:11.5px;color:var(--mute);font-weight:400;}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);}

/* ── 머리 ── */
.top{padding:15px 18px 13px;}
.trow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.bm{font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--ku);margin-bottom:4px;}
h1{font-size:21px;font-weight:800;letter-spacing:-.022em;margin:0;line-height:1.2;}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;font-size:12.5px;color:var(--ink2);transition:.12s;white-space:nowrap;}
.tools button:hover{border-color:var(--ink2);color:var(--ink);}
.tools button.key{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}
.tools button.key:hover{background:#000;}
.navrow{display:flex;align-items:center;gap:9px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line2);font-size:12px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;}
.navrow::-webkit-scrollbar{display:none;}
.navrow .st{display:inline-flex;align-items:center;gap:6px;color:var(--mute);flex:none;}
.navrow .st i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
.navrow.bad .st{color:var(--ku);} .navrow.bad .st i{background:var(--ku);}
.navrow .bar{width:1px;height:11px;background:var(--line);flex:none;}
.navrow a{color:var(--ink2);text-decoration:none;flex:none;background:var(--sunk);
  border:1px solid var(--line);border-radius:6px;padding:3px 10px;line-height:1.5;transition:.12s;}
.navrow a:hover{border-color:var(--ink2);color:var(--ink);background:var(--card);}

.warn{display:none;background:#fffaf0;border:1px solid #ecd9a8;border-left:3px solid #c9971f;
  border-radius:var(--r);padding:11px 15px;font-size:12.5px;color:#7a5a15;margin-bottom:14px;line-height:1.65;}
.warn.show{display:block;}

/* ── 필터 ── */
.filters{padding:12px 18px 14px;}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.frow+.frow{margin-top:9px;padding-top:11px;border-top:1px solid var(--line2);}
.flab{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--mute);width:34px;flex:none;}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--ink2);transition:.12s;white-space:nowrap;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--ink);color:#fff;font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--mute);transition:.12s;white-space:nowrap;}
.chip i{width:3px;height:12px;border-radius:2px;flex:none;opacity:.28;transition:.12s;}
.chip.on{border-color:var(--ink2);color:var(--ink);font-weight:600;}
.chip.on i{opacity:1;}
.chip:hover{border-color:var(--ink2);}
.chip.lead.on{background:var(--ink);border-color:var(--ink);color:#fff;}
details.mo{margin-top:9px;}
details.mo>summary{list-style:none;cursor:pointer;font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:5px;}
details.mo>summary::-webkit-details-marker{display:none;}
details.mo>summary:after{content:'▾';font-size:9px;}
details.mo[open]>summary:after{content:'▴';}
details.mo>summary:hover{color:var(--ink);}
.subs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.subs label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;
  border:1px solid var(--line2);border-radius:6px;padding:3px 9px;background:var(--sunk);}
.subs input{margin:0;accent-color:var(--ink);}
.subs i{width:3px;height:11px;border-radius:2px;}

/* ── 본문 2단 ── */
.main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:14px;align-items:start;}
.main .col-list{order:1;} .main .col-cal{order:2;}
.main .col-cal>.card:last-child{margin-bottom:0;}
@media(max-width:980px){
  .main{grid-template-columns:1fr;}
  .main .col-list{order:2;} .main .col-cal{order:1;}
  .ledger{max-height:none;overflow:visible;}
  .lwrap:after{display:none;}
}

/* ── 탭 ── */
.tabs{display:flex;gap:2px;padding:2px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;}
.tabs button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:12.5px;
  color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap;}
.tabs button:hover{color:var(--ink);}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07);}
.tabs b{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mute);
  background:var(--sunk2);border-radius:9px;padding:1px 6px;line-height:15px;}
.tabs button.on b{background:var(--ink);color:#fff;}
.tabs button.miss b{background:var(--ku-tint);color:var(--ku);}
.tabs button.miss.on b{background:var(--ku);color:#fff;}
.seg2{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;}
.seg2 button{border:0;background:transparent;border-radius:5px;padding:2px 8px;font-size:11.5px;color:var(--mute);}
.seg2 button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06);}

/* ── 목록 ── */
.lwrap{position:relative;}
.lwrap:after{content:'';position:absolute;left:1px;right:1px;bottom:0;height:36px;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0,var(--card) 86%);
  border-radius:0 0 var(--r) var(--r);pointer-events:none;opacity:0;transition:opacity .15s;}
.lwrap.more:after{opacity:1;}
.ledger{padding:6px 0 10px;max-height:560px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#d5d9dd transparent;}
.ledger::-webkit-scrollbar{width:8px;}
.ledger::-webkit-scrollbar-thumb{background:#d5d9dd;border-radius:4px;}
.ledger::-webkit-scrollbar-track{background:transparent;}

.grp{display:flex;align-items:center;gap:9px;padding:13px 18px 5px;}
.grp span{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mute);white-space:nowrap;}
.grp:before{content:'';width:3px;height:11px;background:var(--line);border-radius:2px;flex:none;}
.grp hr{flex:1;border:0;border-top:1px solid var(--line2);margin:0;}
.grp.hot:before{background:var(--ku);} .grp.hot span{color:var(--ku);}

/* 카테고리는 왼쪽 세로 막대로만. 색 점을 텍스트 옆에 두면 글자에 묻혀 안 읽힌다. */
.it{display:flex;align-items:flex-start;gap:11px;padding:9px 18px 9px 15px;position:relative;transition:background .12s;}
.it+.it{border-top:1px solid var(--line2);}
.it:hover{background:var(--sunk);}
.it .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;}
.it.today{background:var(--ku-tint);}
.it.today:hover{background:#fbe9eb;}
.it.done{opacity:.62;}

.ck{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--line);border-radius:5px;
  background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:transparent;line-height:1;transition:.12s;}
.ck:hover{border-color:var(--ok);}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.ck.busy{opacity:.4;}

.dc{flex:none;width:56px;text-align:right;padding-top:1px;}
.dc b{display:block;font-family:var(--mono);font-size:15px;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--ink2);}
.dc span{display:block;font-size:9.5px;color:var(--mute);margin-top:1px;}
.it.urgent .dc b{color:var(--ku);}
.it.today .dc b{color:var(--ku);}
.it.done .dc b{color:var(--ok);font-size:12px;font-weight:700;}

.bd{flex:1;min-width:0;padding-top:1px;}
.tt{font-size:13.5px;line-height:1.45;display:block;word-break:keep-all;color:var(--ink);}
.it.urgent .tt,.it.today .tt{font-weight:600;}
.tt a{text-decoration:none;border-bottom:1px solid var(--line);}
.tt a:hover{border-color:var(--ink);}
.mt{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;font-size:11px;color:var(--mute);}
.mt .ow{color:var(--ink2);background:var(--sunk2);border-radius:4px;padding:0 6px;line-height:16px;}
.mt .ow.req{background:var(--ku-tint);color:var(--ku-d);font-weight:600;}
.mt .rn{border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px;}

.more{width:100%;border:0;background:transparent;padding:10px 18px;font-size:12px;color:var(--mute);text-align:left;}
.more:hover{color:var(--ink);background:var(--sunk);}
.empty{padding:34px 18px 38px;text-align:center;color:var(--mute);font-size:12.5px;line-height:1.85;}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px;font-weight:600;}

/* ── 이번 달 ── */
.mnow{padding:6px 16px 16px;cursor:zoom-in;}
.mnow table,#mDetail table{width:100%;border-collapse:collapse;table-layout:fixed;}
.mnow th,#mDetail th{font-size:11px;font-weight:600;color:var(--mute);padding:0 0 5px;}
.mnow td{vertical-align:top;padding:3px 2px;border-top:1px solid var(--line2);height:70px;}
.sun{color:#b4534f!important;} .sat{color:#4a6b9e!important;}
.dn{font-size:11.5px;color:var(--ink2);font-family:var(--mono);}
td.tdy{background:var(--ku-tint);box-shadow:inset 0 0 0 1.5px var(--ku);border-radius:5px;}
.dn.tdy{background:var(--ku);color:#fff;border-radius:4px;padding:0 5px;font-weight:800;}
/* 알약은 흰 바탕 + 왼쪽 색선. 색으로 칸을 채우면 달력이 색 블록 덩어리가 되고
   제목이 안 읽힌다. 색은 분류만 알려주면 된다. */
.pl{font-size:11px;line-height:1.5;color:var(--ink);background:var(--sunk);
  border-left:3px solid var(--line);border-radius:0 3px 3px 0;padding:1px 4px 1px 5px;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl.done{opacity:.42;}
/* 여러 날 걸친 일정의 「중간 날」 표시. 시작일에만 제목 알약이 뜨고
   나머지 날은 이 막대만 남는다. 도드라지면 무슨 뜻인지 몰라 눈에 걸리므로
   최대한 얇고 흐리게 두고, 뜻은 마우스를 올렸을 때 알려준다. */
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;padding-left:3px;}
.dots i{width:12px;height:2px;border-radius:1px;opacity:.34;transition:opacity .12s;}
td:hover .dots i{opacity:.75;}

/* ── 회고 ── */
.look{padding:8px 18px 16px;}
.lrow{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line2);}
.lrow:first-child{border-top:0;}
.lrow .ago{flex:none;width:56px;text-align:right;}
.lrow .ago b{display:block;font-family:var(--mono);font-size:15px;font-weight:800;letter-spacing:-.03em;color:var(--ink2);line-height:1.2;}
.lrow .ago span{display:block;font-size:9.5px;color:var(--mute);margin-top:1px;}
.lrow .lt{flex:1;min-width:0;font-size:13.5px;line-height:1.45;word-break:keep-all;}
.lrow .lt em{font-style:normal;display:block;font-size:11px;color:var(--mute);margin-top:2px;}
.lrow .lt em b{color:var(--ink);font-weight:600;}
.lrow button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:7px;
  padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.12s;}
.lrow button:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.lrow button:disabled{opacity:.45;cursor:default;background:var(--sunk);border-color:var(--line);color:var(--mute);}
.lookhint{font-size:11px;color:var(--mute);padding-top:10px;margin-top:4px;border-top:1px solid var(--line2);line-height:1.6;}

/* ── 월 격자 ── */
/* 숫자 카드 대신 작은 달력을 깐다. 연간 달력처럼 훑으면
   「이 시기에 뭐가 몰리는지」가 보이고, 작년 이맘때를 찾을 때도 낫다. */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 18px 18px;}
@media(max-width:1100px){.strip{grid-template-columns:repeat(3,1fr);}}
@media(max-width:760px){.strip{grid-template-columns:repeat(2,1fr);}}
@media(max-width:460px){.strip{grid-template-columns:1fr;}}
.mc{border:1px solid var(--line2);border-radius:8px;padding:8px 8px 7px;cursor:pointer;transition:.14s;background:#fff;}
.mc:hover{border-color:var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.05);}
.mc.blank{opacity:.5;}
.mc.cur{border-color:var(--ku);}
.mchd{display:flex;align-items:baseline;gap:5px;margin-bottom:5px;padding:0 1px;}
.mchd b{font-size:12px;font-weight:700;}
.mchd .yr{font-size:9.5px;color:var(--mute);}
.mchd .c{margin-left:auto;font-size:9.5px;color:var(--mute);font-family:var(--mono);}
.mc.cur .mchd b{color:var(--ku);}
.mc table{width:100%;border-collapse:collapse;table-layout:fixed;}
.mc th{font-size:8.5px;font-weight:600;color:var(--mute);padding:0 0 2px;line-height:1.2;}
.mc td{height:17px;text-align:center;vertical-align:top;padding:0;}
.mc .d{font-size:8.5px;color:var(--ink2);font-family:var(--mono);line-height:11px;display:block;}
.mc .d.sun{color:#b4534f;} .mc .d.sat{color:#4a6b9e;}
.mc .d.tdy{background:var(--ku);color:#fff;border-radius:3px;font-weight:800;}
.mc .mk{display:flex;gap:1px;justify-content:center;height:3px;margin-top:1px;}
.mc .mk i{width:3px;height:3px;border-radius:50%;}

/* ── 모달 ── */
#back{position:fixed;inset:0;background:rgba(20,22,25,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
#back.open{display:flex;}
#box{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);
  padding:16px 20px 20px;max-width:1000px;width:100%;max-height:90vh;overflow:auto;}
.mnav{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.mnav .cur{font-size:16px;font-weight:800;letter-spacing:-.02em;}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 11px;font-size:13px;color:var(--ink2);}
.mnav button:hover{border-color:var(--ink2);color:var(--ink);}
.mnav .x{margin-left:auto;border:0;font-size:17px;color:var(--mute);}
#mDetail td{vertical-align:top;padding:5px 4px;border-top:1px solid var(--line2);height:112px;}
#mDetail .dn{font-size:13px;}
#mDetail .pl{font-size:12.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}

/* ── 상세 ── */
#dback{position:fixed;inset:0;background:rgba(20,22,25,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:18px;}
#dback.open{display:flex;}
#dbox{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);
  max-width:520px;width:100%;max-height:86vh;overflow:auto;}
.dhd{display:flex;align-items:center;gap:9px;padding:15px 18px 12px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0;}
.dhd h3{font-size:15px;font-weight:800;margin:0;letter-spacing:-.02em;}
.dhd .n{font-size:11.5px;color:var(--mute);}
.dhd .x{margin-left:auto;border:0;background:transparent;font-size:17px;color:var(--mute);padding:2px 6px;}
.dhd .x:hover{color:var(--ink);}
.dev{padding:14px 18px 16px;border-top:1px solid var(--line2);position:relative;}
.dev:first-of-type{border-top:0;}
.dev .dbar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;}
.dev .dt{font-size:14.5px;font-weight:600;line-height:1.45;word-break:keep-all;margin-bottom:10px;}
.dev.fin .dt{color:var(--ink2);}
.drow{display:flex;gap:10px;font-size:12.5px;padding:3px 0;}
.drow dt{flex:none;width:56px;color:var(--mute);font-size:11.5px;padding-top:1px;}
.drow dd{margin:0;flex:1;min-width:0;color:var(--ink2);word-break:break-all;}
.drow dd b{color:var(--ku);font-weight:600;}
.dact{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.dact button,.dact a{border:1px solid var(--line);background:var(--card);border-radius:7px;

/* ── 날짜 ── */
const pad = n => n < 10 ? '0'+n : ''+n;
const pd  = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
const db  = (a,b) => Math.round((b-a)/86400000);
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const shift = (s,n) => { const t = pd(s); t.setDate(t.getDate()+n); return fmt(t); };
const md = s => s.slice(5).replace('-','.');
const DOW = '일월화수목금토';
const TS = fmt(new Date()), TODAY = pd(TS);
const THIS_Y = TODAY.getFullYear(), THIS_M = TODAY.getMonth()+1;

const STRIP = (function(){ const o=[]; let y=THIS_Y,m=THIS_M;
  for(let i=0;i<12;i++){ m++; if(m>12){m=1;y++;} o.push([y,m]); } return o; })();
const PAST = (function(){ const o=[]; let y=THIS_Y,m=THIS_M;
  for(let i=0;i<24;i++){ m--; if(m<1){m=12;y--;} o.unshift([y,m]); } return o; })();

/* ── GAS ── */
function jsonp(params, cb){
  const n = 'cal_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  let done = false;
  window[n] = r => { done = true; delete window[n]; cb(r); };
  const q = Object.keys(params).map(k => k+'='+encodeURIComponent(params[k])).join('&');
  const sc = document.createElement('script');
  sc.src = GAS_URL + '?' + q + '&callback=' + n;
  sc.onerror = () => { if(!done){ delete window[n]; cb({status:'error', message:'네트워크 오류'}); } };
  document.body.appendChild(sc);
  setTimeout(() => { if(!done){ delete window[n]; cb({status:'error', message:'응답 시간 초과'}); } }, 12000);
}
function loadCal(nocache){
  setStatus('load');
  jsonp({action:'getCalendar', nocache: nocache ? 1 : 0}, res => {
    if(res && res.status === 'ok' && res.events && res.events.length){
      events = res.events;
      setStatus('ok', res.count + '건 · ' + (res.updated||'') + (res.cached ? ' · 캐시' : ''));
      hideWarn(); renderAll();
    } else fallback(res && res.message ? res.message : '시트에서 일정을 읽지 못했습니다');
  });
}
function fallback(msg){
  events = BACKUP.slice();
  setStatus('bad', '백업 ' + BACKUP.length + '건');
  showWarn('<b>구글시트에서 일정을 불러오지 못했습니다</b> — ' + msg + '<br>' +
    '지금 보이는 것은 2026-08-06 시점의 내장 백업입니다. 그 뒤 시트에서 바꾼 내용은 빠져 있습니다. ' +
    '<b>↻ 새로고침</b>으로 다시 시도하고, 계속 실패하면 GAS 배포 상태를 확인하세요.');
  renderAll();
}
function setStatus(kind, txt){
  document.getElementById('navrow').className = 'navrow' + (kind === 'bad' ? ' bad' : '');
  document.getElementById('stText').textContent = kind === 'load' ? '불러오는 중' : txt;
}
function showWarn(h){ const w = document.getElementById('warn'); w.innerHTML = h; w.classList.add('show'); }
function hideWarn(){ document.getElementById('warn').classList.remove('show'); }

/* ── 쓰기 ── */
function askKey(){
  const k = prompt('쓰기 암호를 입력하세요.\n\nGAS 편집기에서 showCalendarKey() 를 실행하면 볼 수 있습니다.\n한 번 입력하면 이 브라우저에 저장됩니다.');
  if(k === null) return false;
  writeKey = k.trim().toUpperCase();
  try{ localStorage.setItem(KEY_KEY, writeKey); }catch(e){}
  return true;
}
function write(params, cb){
  if(!writeKey && !askKey()) return;
  params.key = writeKey;
  jsonp(params, res => {
    if(res && res.code === 'badkey'){
      writeKey = '';
      try{ localStorage.removeItem(KEY_KEY); }catch(e){}
      alert('쓰기 암호가 맞지 않습니다. 다시 입력해 주세요.');
      return;
    }
    if(!res || res.status !== 'ok'){ alert('저장하지 못했습니다.\n' + ((res && res.message) || '알 수 없는 오류')); return; }
    cb(res);
  });
}
function toggleDone(e, btn, after){
  const on = !e.d;
  btn.classList.add('busy');
  write({action:'setDone', id:e.i, done: on ? 1 : 0}, res => {
    e.d = res.done || '';
    btn.classList.remove('busy');
    renderAll();
    if(after) after();
  });
}

/* ── 목록 ──
   세 탭으로 나눈다. 이전 버전은 「지난 마감」이 목록 맨 위에 깔려
   정작 오늘·이번 주가 스크롤 아래로 밀렸다. 아침에 여는 화면이 「못 한 일」로
   시작하면 부담만 크고, 급한 것을 보려고 스크롤해야 하는 것은 순서가 뒤집힌 것이다. */
const anchorOf = e => (e.s <= TS ? e.e : e.s);

function buckets(){
  const base = events.filter(visible);
  const limS = rangeDays ? shift(TS, rangeDays) : '9999-12-31';
  return {
    todo: base.filter(e => !e.d && e.e >= TS && e.s <= limS).sort((a,b) => {
      const x = anchorOf(a), y = anchorOf(b);
      if(x !== y) return x < y ? -1 : 1;
      const as = a.s <= TS ? 0 : 1, bs = b.s <= TS ? 0 : 1;
      if(as !== bs) return as - bs;
      return a.t < b.t ? -1 : 1;
    }),
    miss: base.filter(e => !e.d && e.e < TS && e.e >= shift(TS, -MISS_DAYS) &&
                           (e.o === 'biz' || e.o === 'req'))
              .sort((a,b) => a.e > b.e ? -1 : 1),
    done: base.filter(e => e.d && e.d >= shift(TS, -DONE_DAYS))
              .sort((a,b) => a.d > b.d ? -1 : 1)
  };
}

function renderLedger(){
  const B = buckets();
  document.getElementById('cTodo').textContent = B.todo.length;
  document.getElementById('cMiss').textContent = B.miss.length;
  document.getElementById('cDone').textContent = B.done.length;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  document.getElementById('segRange').style.display = tab === 'todo' ? '' : 'none';

  const root = document.getElementById('ledger');
  root.innerHTML = '';
  const list = B[tab];

  if(!list.length){
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = tab === 'miss'
      ? '<b>놓친 마감이 없습니다</b>마감이 지났는데 완료 표시가 안 된 일이 여기 모입니다.'
      : tab === 'done'
      ? '<b>최근 완료한 일이 없습니다</b>왼쪽 네모를 누르면 완료로 기록됩니다.'
      : '<b>표시할 일정이 없습니다</b>기간을 넓히거나 담당 필터를 확인해 보세요.';
    root.appendChild(d);
    return;
  }

  const shown = showAll ? list : list.slice(0, ROW_LIMIT);

  if(tab === 'todo'){
    const BK = [{max:0,l:'오늘',h:1},{max:7,l:'이번 주 안',h:1},{max:14,l:'2주 안',h:0},
                {max:30,l:'이번 달 안',h:0},{max:90,l:'3개월 안',h:0},{max:99999,l:'그 이후',h:0}];
    let bi = -1;
    shown.forEach(e => {
      const dn = db(TODAY, pd(anchorOf(e)));
      let w = 0; while(BK[w].max < dn) w++;
      if(w !== bi){ bi = w; root.appendChild(grpEl(BK[bi].h ? 'hot' : '', BK[bi].l)); }
      root.appendChild(itemEl(e, dn));
    });
  } else {
    shown.forEach(e => root.appendChild(itemEl(e, 0)));
  }

  if(list.length > ROW_LIMIT){
    const b = document.createElement('button');
    b.className = 'more';
    b.textContent = showAll ? '접기' : '+ ' + (list.length - ROW_LIMIT) + '건 더 보기';
    b.addEventListener('click', () => { showAll = !showAll; renderLedger(); });
    root.appendChild(b);
  }
}
function grpEl(cls, label){
  const g = document.createElement('div');
  g.className = 'grp' + (cls ? ' ' + cls : '');
  g.innerHTML = '<span>' + label + '</span><hr>';
  return g;
}

function itemEl(e, dn){
  const cat = CAT[e.c] || CAT.other;
  const row = document.createElement('div');
  const isToday = tab === 'todo' && dn === 0;
  row.className = 'it' + (e.d ? ' done' : '') + (isToday ? ' today' : '') +
                  (tab === 'todo' && !e.d && dn > 0 && dn <= 3 ? ' urgent' : '') +
                  (tab === 'miss' ? ' urgent' : '');

  const bar = document.createElement('span');
  bar.className = 'bar';
  bar.style.background = cat.c;
  row.appendChild(bar);

  const ck = document.createElement('button');
  ck.className = 'ck' + (e.d ? ' on' : '');
  ck.textContent = '✓';
  ck.title = e.d ? '완료 해제 (' + e.d + ')' : '완료로 표시';
  ck.setAttribute('aria-label', ck.title);
  ck.addEventListener('click', ev => { ev.stopPropagation(); toggleDone(e, ck); });
  row.appendChild(ck);
  row.title = '눌러서 상세 보기';
  row.addEventListener('click', () => openDetail([e], e.t.length > 26 ? e.t.slice(0,26) + '…' : e.t, ''));

  // 🔴 「+-6」처럼 부호가 겹쳐 암호가 되지 않게, 큰 글씨는 날짜나 D-n 만 담고
  //    성격은 아래 작은 글씨로 말로 쓴다.
  const dc = document.createElement('div');
  dc.className = 'dc';
  if(tab === 'miss'){
    dc.innerHTML = '<b>' + md(e.e) + '</b><span>' + db(pd(e.e), TODAY) + '일 지남</span>';
  } else if(tab === 'done'){
    dc.innerHTML = '<b>완료</b><span>' + md(e.d) + '</span>';
  } else {
    const anc = anchorOf(e);
    dc.innerHTML = '<b>' + (dn === 0 ? '오늘' : 'D-' + dn) + '</b><span>' +
                   md(anc) + '(' + DOW[pd(anc).getDay()] + ')</span>';
  }
  row.appendChild(dc);

  const bd = document.createElement('div');
  bd.className = 'bd';
  const t = document.createElement('span');
  t.className = 'tt';
  if(e.u){
    const a = document.createElement('a');
    a.href = e.u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = e.t;
    t.appendChild(a);
  } else t.textContent = e.t;
  bd.appendChild(t);

  const m = document.createElement('div');
  m.className = 'mt';
  m.innerHTML = '<span>' + cat.n + '</span>' +
    '<span class="ow' + (e.o === 'req' ? ' req' : '') + '">' + (OWN[e.o]||'') + '</span>' +
    (tab === 'todo' && e.s <= TS && !e.d ? '<span class="rn">진행 중 · ' + md(e.s) + ' 시작</span>' : '') +
    (e.n ? '<span>' + esc(e.n) + '</span>' : '');
  bd.appendChild(m);
  row.appendChild(bd);
  return row;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderLook(){
  const root = document.getElementById('look');
  const card = document.getElementById('lookCard');
  root.innerHTML = '';
  const lastY = shift(TS, -365);
  const from = shift(lastY, -10), to = shift(lastY, 35);
  const cand = events.filter(e => visible(e) && e.r && e.s >= from && e.s <= to);
  const near = events.filter(e => e.s >= shift(TS, -45) && e.s <= shift(TS, 150));
  const rows = cand.filter(e => !near.some(x => x.t === e.t))
                   .sort((a,b) => a.s < b.s ? -1 : 1).slice(0, 6);
  if(!rows.length){ card.style.display = 'none'; return; }
  card.style.display = '';

  rows.forEach(e => {
    const span = db(pd(e.s), pd(e.e));
    const guess = shift(TS, db(pd(lastY), pd(e.s)));
    const r = document.createElement('div');
    r.className = 'lrow';
    const a = document.createElement('span');
    a.className = 'ago';
    a.innerHTML = '<b>' + md(e.s) + '</b><span>' + e.s.slice(2,4) + '년 · ' + DOW[pd(e.s).getDay()] + '</span>';
    r.appendChild(a);
    const t = document.createElement('div');
    t.className = 'lt';
    t.innerHTML = esc(e.t) + '<em>' + (CAT[e.c]||CAT.other).n + ' · ' + (OWN[e.o]||'') +
                  ' · 올해라면 <b>' + md(guess) + '(' + DOW[pd(guess).getDay()] + ')</b> 무렵</em>';
    r.appendChild(t);
    const btn = document.createElement('button');
    btn.textContent = '올해 일정 만들기';
    btn.addEventListener('click', () => {
      const s = prompt('올해 시작일을 확인하세요. (공문이 나왔으면 실제 날짜로 고치세요)', guess);
      if(!s) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s.trim())){ alert('YYYY-MM-DD 형식으로 입력하세요.'); return; }
      btn.disabled = true; btn.textContent = '추가 중…';
      write({action:'addEvent', title:e.t, start:s.trim(), end:shift(s.trim(), span),
             cat:CAT_KO[e.c]||'기타', owner:OWN_KO[e.o]||'사업단', rep:e.r,
             note:'작년 ' + e.s + ' 기준으로 생성'}, () => { btn.textContent = '추가됨'; loadCal(true); });
    });
    r.appendChild(btn);
    root.appendChild(r);
  });
  const hint = document.createElement('div');
  hint.className = 'lookhint';
  hint.textContent = '작년 날짜를 그대로 쓰지 않습니다. 공문이 나오면 실제 날짜로 고치세요. 매주 월요일 아침 메일로도 옵니다.';
  root.appendChild(hint);
}

/* ── 달력 ── */
function monthList(y,m){
  const f = y+'-'+pad(m)+'-01', dim = new Date(y,m,0).getDate();
  return events.filter(e => visible(e) && e.e >= f && e.s <= y+'-'+pad(m)+'-'+pad(dim));
}
function monthTable(y,m){
  const tb = document.createElement('table');
  let h = '<thead><tr>';
  for(let i=0;i<7;i++) h += '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+DOW[i]+'</th>';
  tb.innerHTML = h + '</tr></thead>';
  const body = document.createElement('tbody');
  const first = new Date(y,m-1,1).getDay(), dim = new Date(y,m,0).getDate();
  let tr = document.createElement('tr'), day = 1;
  for(let i=0;i<first;i++) tr.appendChild(document.createElement('td'));
  while(day <= dim){
    const col = (first+day-1)%7;
    if(col === 0 && day !== 1){ body.appendChild(tr); tr = document.createElement('tr'); }
    const ds = y+'-'+pad(m)+'-'+pad(day);
    const td = document.createElement('td');
    if(ds === TS) td.className = 'tdy';
    const n = document.createElement('div');
    n.className = 'dn' + (ds === TS ? ' tdy' : (col===0?' sun':col===6?' sat':''));
    n.textContent = day;
    td.appendChild(n);

    const within = events.filter(e => visible(e) && ds >= e.s && ds <= e.e);
    within.filter(e => e.s === ds).forEach(e => {
      const p = document.createElement('div');
      p.className = 'pl' + (e.d ? ' done' : '');
      p.style.borderLeftColor = (CAT[e.c]||CAT.other).c;
      p.title = e.t + (e.n ? '  |  ' + e.n : '') + '\n눌러서 상세 보기';
      p.textContent = e.t;
      p.addEventListener('click', ev => {
        ev.stopPropagation();
        openDetail([e], e.t.length > 26 ? e.t.slice(0,26) + '…' : e.t, '');
      });
      td.appendChild(p);
    });
    const cont = within.filter(e => e.s !== ds);
    if(cont.length){
      const dots = document.createElement('div');
      dots.className = 'dots';
      dots.title = cont.map(e => e.t + ' (' + md(e.s) + '~' + md(e.e) + ')').join('\n');
      cont.slice(0,6).forEach(e => {
        const i = document.createElement('i');
        i.style.background = (CAT[e.c]||CAT.other).c;
        if(e.d) i.style.opacity = .18;
        dots.appendChild(i);
      });
      td.appendChild(dots);
    }
    if(within.length){
      td.style.cursor = 'pointer';
      td.addEventListener('click', ev => {
        ev.stopPropagation();
        openDetail(within.slice().sort((a,b) => a.s < b.s ? -1 : 1),
                   m + '월 ' + (Number(ds.slice(8))) + '일 (' + DOW[pd(ds).getDay()] + ')', '');
      });
    }
    tr.appendChild(td); day++;
  }
  while(tr.children.length < 7) tr.appendChild(document.createElement('td'));
  body.appendChild(tr); tb.appendChild(body);
  return tb;
}
function renderNow(){
  const r = document.getElementById('mnow');
  r.innerHTML = '';
  r.appendChild(monthTable(THIS_Y, THIS_M));
  document.getElementById('mnowTitle').textContent = THIS_Y + '년 ' + THIS_M + '월';
  document.getElementById('mnowCount').textContent = monthList(THIS_Y, THIS_M).length + '건';
}
/* 작은 달력 한 장. 날짜 아래 점으로 그날 일정을 알린다.
   숫자만 보여주던 카드보다 「어느 시기에 몰리는지」가 눈에 들어온다. */
function monthCell(y,m){
  const l = monthList(y,m), n = l.length;
  const hot = l.filter(e => e.o === 'biz' || e.o === 'req').length;
  const isCur = (y === THIS_Y && m === THIS_M);

  const c = document.createElement('div');
  c.className = 'mc' + (n === 0 ? ' blank' : '') + (isCur ? ' cur' : '');
  c.title = n ? n + '건 (내 일 ' + hot + '건) — 눌러서 크게 보기' : '일정 없음';

  const hd = document.createElement('div');
  hd.className = 'mchd';
  hd.innerHTML = '<b>' + m + '월</b><span class="yr">' + y + '</span>' +
                 '<span class="c">' + (n || '') + '</span>';
  c.appendChild(hd);

  const tb = document.createElement('table');
  let th = '<thead><tr>';
  for(let i=0;i<7;i++) th += '<th>' + DOW[i] + '</th>';
  tb.innerHTML = th + '</tr></thead>';

  const body = document.createElement('tbody');
  const first = new Date(y,m-1,1).getDay(), dim = new Date(y,m,0).getDate();
  let tr = document.createElement('tr'), day = 1;
  for(let i=0;i<first;i++) tr.appendChild(document.createElement('td'));
  while(day <= dim){
    const col = (first+day-1)%7;
    if(col === 0 && day !== 1){ body.appendChild(tr); tr = document.createElement('tr'); }
    const ds = y+'-'+pad(m)+'-'+pad(day);
    const td = document.createElement('td');
    const d = document.createElement('span');
    d.className = 'd' + (ds === TS ? ' tdy' : (col===0?' sun':col===6?' sat':''));
    d.textContent = day;
    td.appendChild(d);

    // 그날 시작하는 일정만 점으로. 걸쳐 있는 것까지 찍으면 온통 점이 된다.
    const st = events.filter(e => visible(e) && e.s === ds);
    if(st.length){
      const mk = document.createElement('div');
      mk.className = 'mk';
      st.slice(0,3).forEach(e => {
        const i = document.createElement('i');
        i.style.background = (CAT[e.c]||CAT.other).c;
        if(e.d) i.style.opacity = .3;
        mk.appendChild(i);
      });
      td.appendChild(mk);
      td.title = st.map(x => x.t).join('\n');
    }
    tr.appendChild(td); day++;
  }
  while(tr.children.length < 7) tr.appendChild(document.createElement('td'));
  body.appendChild(tr);
  tb.appendChild(body);
  c.appendChild(tb);

  c.addEventListener('click', () => openModal(y,m));
  return c;
}
function renderStrip(){
  const r = document.getElementById('strip');
  r.innerHTML = '';
  STRIP.forEach(a => r.appendChild(monthCell(a[0],a[1])));
  document.getElementById('rangeNote').textContent =
    STRIP[0][0]+'.'+pad(STRIP[0][1]) + ' ~ ' + STRIP[11][0]+'.'+pad(STRIP[11][1]);
  if(pastOpen){
    const p = document.getElementById('past');
    p.innerHTML = '';
    PAST.forEach(a => p.appendChild(monthCell(a[0],a[1])));
  }
}
function openModal(y,m){ modalYM = [y,m]; modalOpen = true; document.getElementById('back').classList.add('open'); renderModal(); }
function closeModal(){ modalOpen = false; document.getElementById('back').classList.remove('open'); }
function stepModal(d){ let [y,m] = modalYM; m += d; if(m>12){m=1;y++;} if(m<1){m=12;y--;} modalYM=[y,m]; renderModal(); }
function renderModal(){
  const d = document.getElementById('mDetail');
  d.innerHTML = '';
  d.appendChild(monthTable(modalYM[0], modalYM[1]));
  document.getElementById('mCur').textContent = modalYM[0] + '년 ' + modalYM[1] + '월';
}

/* ── 상세 ──
   목록 항목이나 달력 알약을 누르면 그 일정의 전부를 보여준다.
   제목이 길어 잘리는 문제도 여기서 해소된다. */
let detailOpen = false;

function openDetail(list, title, sub){
  if(!list.length) return;
  detailOpen = true;
  document.getElementById('dTitle').textContent = title;
  document.getElementById('dSub').textContent = sub || (list.length > 1 ? list.length + '건' : '');
  const b = document.getElementById('dBody');
  b.innerHTML = '';
  list.forEach(e => b.appendChild(detailEl(e)));
  document.getElementById('dback').classList.add('open');
}
function closeDetail(){ detailOpen = false; document.getElementById('dback').classList.remove('open'); }

function detailEl(e){
  const cat = CAT[e.c] || CAT.other;
  const w = document.createElement('div');
  w.className = 'dev' + (e.d ? ' fin' : '');

  const bar = document.createElement('span');
  bar.className = 'dbar';
  bar.style.background = cat.c;
  w.appendChild(bar);

  const t = document.createElement('div');
  t.className = 'dt';
  t.textContent = e.t;
  w.appendChild(t);

  const anc = anchorOf(e);
  const dn = db(TODAY, pd(anc));
  const period = e.s === e.e
    ? md(e.s) + '(' + DOW[pd(e.s).getDay()] + ')'
    : md(e.s) + '(' + DOW[pd(e.s).getDay()] + ') ~ ' + md(e.e) + '(' + DOW[pd(e.e).getDay()] + ')  ·  ' + (db(pd(e.s), pd(e.e)) + 1) + '일';
  let when = '';
  if(e.e < TS)      when = db(pd(e.e), TODAY) + '일 지남';
  else if(dn === 0) when = '오늘';
  else              when = 'D-' + dn + (e.s <= TS ? ' (진행 중)' : '');

  const rows = [
    ['기간',   period],
    ['남은 날', '<b>' + when + '</b>'],
    ['분류',   cat.n + '  ·  담당 ' + (OWN[e.o] || '')],
    ['반복',   e.r || '—'],
    ['비고',   e.n ? esc(e.n) : '—'],
    ['일정ID', e.i]
  ];
  if(e.d) rows.splice(2, 0, ['완료', '<b>' + e.d + '</b> 처리됨']);
  if(e.u) rows.push(['링크', '<a href="' + e.u + '" target="_blank" rel="noopener">' + esc(e.u) + '</a>']);

  rows.forEach(r => {
    const d = document.createElement('dl');
    d.className = 'drow';
    d.innerHTML = '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>';
    w.appendChild(d);
  });

  const act = document.createElement('div');
  act.className = 'dact';

  const fin = document.createElement('button');
  fin.className = e.d ? 'fin' : '';
  fin.textContent = e.d ? '✓ 완료 해제' : '완료로 표시';
  fin.addEventListener('click', () => {
    fin.classList.add('busy');
    toggleDone(e, fin, () => { fin.classList.remove('busy'); w.replaceWith(detailEl(e)); });
  });
  act.appendChild(fin);

  const cp = document.createElement('button');
  cp.textContent = '일정ID 복사';
  cp.addEventListener('click', () => {
    const done = () => { cp.textContent = '복사됨'; setTimeout(() => cp.textContent = '일정ID 복사', 1500); };
    if(navigator.clipboard) navigator.clipboard.writeText(e.i).then(done, () => prompt('복사하세요', e.i));
    else prompt('복사하세요', e.i);
  });
  act.appendChild(cp);

  const sh = document.createElement('a');
  sh.href = SHEET_URL; sh.target = '_blank'; sh.rel = 'noopener';
  sh.textContent = '시트에서 열기';
  sh.title = '시트를 연 뒤 Ctrl+F 로 ' + e.i + ' 를 찾으면 됩니다';
  act.appendChild(sh);

  w.appendChild(act);
  return w;
}

/* ── 높이 : 달력이 기준, 목록이 따라간다 ── */
function syncHeight(){
  const led = document.getElementById('ledger');
  const cal = document.querySelector('.col-cal');
  const card = document.querySelector('.col-list > .card');
  if(!led || !cal || !card) return;
  if(window.innerWidth <= 980){ led.style.maxHeight = ''; updateFade(); return; }
  const chrome = card.offsetHeight - led.offsetHeight;
  led.style.maxHeight = Math.max(320, cal.offsetHeight - chrome) + 'px';
  updateFade();
}
function updateFade(){
  const l = document.getElementById('ledger'), w = document.getElementById('lwrap');
  if(!l || !w) return;
  const room = l.scrollHeight - l.clientHeight;
  w.classList.toggle('more', room > 8 && l.scrollTop < room - 8);
}

/* ── 필터 ── */
function buildFilters(){
  const chips = document.getElementById('chips');
  Object.keys(GROUPS).forEach(k => {
    const g = GROUPS[k];
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.g = k;
    b.innerHTML = '<i style="background:' + g.c + '"></i>' + g.n;
    b.addEventListener('click', () => {
      const allOn = g.cats.every(c => !offCats.has(c));
      g.cats.forEach(c => allOn ? offCats.add(c) : offCats.delete(c));
      apply();
    });
    chips.appendChild(b);
  });
  const sub = document.getElementById('subs');
  ALL_CATS.forEach(c => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" data-c="' + c + '"><i style="background:' + CAT[c].c + '"></i>' + CAT[c].n;
    l.querySelector('input').addEventListener('change', function(){
      this.checked ? offCats.delete(c) : offCats.add(c);
      apply();
    });
    sub.appendChild(l);
  });
  document.getElementById('chipAll').addEventListener('click', () => {
    offCats = offCats.size ? new Set() : new Set(ALL_CATS);
    apply();
  });
  document.querySelectorAll('#segOwner button').forEach(b =>
    b.addEventListener('click', () => { ownerMode = b.dataset.o; showAll = false; apply(); }));
  document.querySelectorAll('#segRange button').forEach(b =>
    b.addEventListener('click', () => { rangeDays = Number(b.dataset.d); showAll = false; apply(); }));
  document.querySelectorAll('#tabs button').forEach(b =>
    b.addEventListener('click', () => { tab = b.dataset.t; showAll = false; renderLedger(); setTimeout(syncHeight,0); }));
}
function syncFilters(){
  document.querySelectorAll('#segOwner button').forEach(b => b.classList.toggle('on', b.dataset.o === ownerMode));
  document.querySelectorAll('#segRange button').forEach(b => b.classList.toggle('on', Number(b.dataset.d) === rangeDays));
  document.querySelectorAll('#chips .chip').forEach(b => b.classList.toggle('on', GROUPS[b.dataset.g].cats.every(c => !offCats.has(c))));
  document.getElementById('chipAll').classList.toggle('on', offCats.size === 0);
  document.querySelectorAll('#subs input').forEach(i => i.checked = !offCats.has(i.dataset.c));
}
function apply(){ savePref(); syncFilters(); renderAll(); }

/* ── ICS ── */
const icsEsc = t => String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function exportIcs(){
  const list = events.filter(visible);
  if(!list.length){ alert('내보낼 일정이 없습니다. 필터를 확인하세요.'); return; }
  if(!confirm(list.length + '건을 .ics 파일로 내려받습니다.\n\n' +
    '구글 캘린더에 넣기 전에 새 캘린더를 먼저 만들고(왼쪽 「다른 캘린더 +」 → 「새 캘린더 만들기」),\n' +
    '가져오기 대상으로 그 캘린더를 지정하세요.\n' +
    '기존 캘린더에 바로 부으면 되돌리기가 어렵습니다.\n\n계속할까요?')) return;
  const now = new Date();
  const st = now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+
             pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KI-STAR//Calendar//KO',
             'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:KI-STAR 업무'];
  list.forEach((e,i) => {
    L.push('BEGIN:VEVENT');
    L.push('UID:' + (e.i || ('E'+i)) + '@kistar.korea.ac.kr');
    L.push('DTSTAMP:' + st);
    L.push('DTSTART;VALUE=DATE:' + e.s.replace(/-/g,''));
    L.push('DTEND;VALUE=DATE:' + shift(e.e, 1).replace(/-/g,''));   // 종일 일정의 DTEND는 종료 다음 날
    L.push('SUMMARY:' + icsEsc((e.d ? '[완료] ' : '') + e.t));
    const ds = [OWN[e.o] ? '담당: '+OWN[e.o] : '', e.n||''].filter(Boolean).join(' / ');
    if(ds) L.push('DESCRIPTION:' + icsEsc(ds));
    if(e.u) L.push('URL:' + e.u);
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+L.join('\r\n')], {type:'text/calendar;charset=utf-8'}));
  a.download = 'KI-STAR_일정_' + TS + '.ics';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 배선 ── */
function renderAll(){
  renderLedger(); renderLook(); renderNow(); renderStrip();
  if(modalOpen) renderModal();
  setTimeout(syncHeight, 0);
}
(function(){
  const q = document.getElementById('quick');
  LINKS.forEach(l => {
    const a = document.createElement('a');
    a.href = HUB + l[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l[1];
    q.appendChild(a);
  });
})();
document.getElementById('bReload').addEventListener('click', () => loadCal(true));
document.getElementById('bSheet').addEventListener('click', () => window.open(SHEET_URL,'_blank','noopener'));
document.getElementById('bPrint').addEventListener('click', () => window.print());
document.getElementById('bIcs').addEventListener('click', exportIcs);
document.getElementById('bPrev').addEventListener('click', () => stepModal(-1));
document.getElementById('bNext').addEventListener('click', () => stepModal(1));
document.getElementById('bClose').addEventListener('click', closeModal);
document.getElementById('back').addEventListener('click', e => { if(e.target.id === 'back') closeModal(); });
document.getElementById('dClose').addEventListener('click', closeDetail);
document.getElementById('dback').addEventListener('click', e => { if(e.target.id === 'dback') closeDetail(); });
document.getElementById('mnow').addEventListener('click', () => openModal(THIS_Y, THIS_M));
document.getElementById('ledger').addEventListener('scroll', updateFade, {passive:true});
window.addEventListener('resize', syncHeight);
if(window.ResizeObserver) new ResizeObserver(() => syncHeight()).observe(document.querySelector('.col-cal'));
document.addEventListener('keydown', e => {
  if(detailOpen){ if(e.key === 'Escape') closeDetail(); return; }   // 상세가 위층이다
  if(!modalOpen) return;
  if(e.key === 'Escape') closeModal();
  if(e.key === 'ArrowLeft') stepModal(-1);
  if(e.key === 'ArrowRight') stepModal(1);
});
document.getElementById('bPast').addEventListener('click', function(){
  pastOpen = !pastOpen;
  document.getElementById('past').style.display = pastOpen ? 'grid' : 'none';
  this.textContent = pastOpen ? '지난 일정 접기' : '지난 일정 펼치기';
  if(pastOpen) renderStrip();
});

buildFilters();
syncFilters();
renderAll();
loadCal(false);
</script>
