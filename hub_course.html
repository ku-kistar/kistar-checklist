<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>융합전공 개설 · 교과목 허브 | KI-STAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{--green:#10b981;--green2:#34d399;--deep:#071a15;--red:#c8392b;--amber:#f5c563}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--deep);min-height:100vh;overflow-x:hidden;word-break:keep-all}
.bg-wrap{position:fixed;inset:0;z-index:0;background:linear-gradient(170deg,#08221b 0%,#071a15 40%,#04100c 100%)}
.bg-grid{position:absolute;inset:0;opacity:.04;background-image:linear-gradient(90deg,#10b981 1px,transparent 1px),linear-gradient(0deg,#10b981 1px,transparent 1px);background-size:48px 48px}
.bg-g1{position:absolute;top:-20%;left:-10%;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.08) 0%,transparent 60%);pointer-events:none}
.bg-g2{position:absolute;bottom:-15%;right:-8%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,57,43,.05) 0%,transparent 60%);pointer-events:none}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:2rem}

/* ── 상단 바 ── */
.topbar{width:100%;background:rgba(4,12,10,.72);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:80;backdrop-filter:blur(6px)}
.topbar-l{display:flex;align-items:center;gap:10px;min-width:0}
.top-badge{font-size:10px;font-weight:700;letter-spacing:.1em;background:rgba(16,185,129,.15);color:var(--green);padding:3px 8px;border-radius:4px;white-space:nowrap}
.top-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.topbar-r{display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:relative}
.top-badge.as{background:rgba(245,197,99,.18);color:var(--amber);letter-spacing:0}
.as-box{position:absolute;top:calc(100% + 7px);right:0;z-index:60;min-width:180px;padding:7px;background:#0e2a22;border:1px solid rgba(16,185,129,.28);border-radius:10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.as-t{font-size:10.5px;color:rgba(255,255,255,.35);padding:5px 9px 6px}
.as-box button{text-align:left;font-family:inherit;font-size:12px;padding:7px 10px;border-radius:6px;background:none;border:none;color:rgba(255,255,255,.72);cursor:pointer}
.as-box button:hover{background:rgba(16,185,129,.14);color:#fff}
.as-box button.on{background:rgba(16,185,129,.18);color:var(--green2)}
.as-box .as-off{margin-top:4px;border-top:1px solid rgba(255,255,255,.09);border-radius:0 0 6px 6px;color:var(--amber);font-size:11.5px}
.top-who{font-size:12px;color:rgba(255,255,255,.45)}
.top-btn{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:6px;color:rgba(255,255,255,.4);font-size:11px;font-family:inherit;padding:4px 10px;cursor:pointer;white-space:nowrap}
.top-btn:hover{color:#fff;border-color:rgba(255,255,255,.45)}
.top-btn.on{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.5);color:var(--green2)}

/* ── 헤더 (학생 포털과 동일 수치) ── */
.header{width:100%;max-width:680px;padding:2.4rem 2rem 0;display:flex;align-items:flex-start;gap:22px}
.chip-wrap{flex-shrink:0;margin-top:2px;animation:chipFloat 4s ease-in-out infinite}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.chip-wrap{animation:none}}
.header-text{display:flex;flex-direction:column;gap:5px}
.header-org{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(16,185,129,.65);white-space:nowrap}
.header-title{font-size:clamp(20px,4.8vw,42px);font-weight:900;color:#fff;line-height:1.1;letter-spacing:-.03em}
.header-title .line1{display:block;font-size:.55em;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:-.01em;margin-bottom:.15em}
.header-title .accent{color:var(--green)}
.main-msg{width:100%;max-width:680px;padding:1.8rem 2rem .2rem}
.msg-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.msg-list li{display:flex;align-items:flex-start;gap:8px;line-height:1.45}
.msg-main{font-size:clamp(11px,1.7vw,13px);color:rgba(255,255,255,.7)}
.msg-main .dot{color:var(--green);font-size:1.1em;font-weight:900;flex-shrink:0;margin-top:.15em}

/* ── 로그인 ── */
#auth{position:fixed;inset:0;z-index:200;background:var(--deep);display:none;align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto}
#auth.show{display:flex}
.auth-inner{width:100%;max-width:400px}
.auth-card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(16,185,129,.2);border-radius:16px;padding:2rem 1.8rem}
.auth-logo{text-align:center;margin-bottom:1.5rem}
.auth-logo svg{width:48px;height:48px}
.auth-title{font-size:17px;font-weight:700;color:#fff;text-align:center;margin-bottom:.4rem}
.auth-sub{font-size:12px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:1.6rem;line-height:1.6}
.auth-field{margin-bottom:1rem}
.auth-field label{display:block;font-size:11px;font-weight:600;color:rgba(16,185,129,.85);margin-bottom:.4rem;letter-spacing:.05em}
.auth-field input{width:100%;padding:11px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.auth-field input:focus{border-color:rgba(16,185,129,.6)}
.auth-field input::placeholder{color:rgba(255,255,255,.25)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.35);cursor:pointer;padding:6px}
.auth-btn{width:100%;padding:12px;background:var(--green);border:none;border-radius:8px;color:#04241b;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.auth-btn:hover{opacity:.9}
.auth-btn:disabled{opacity:.5;cursor:default}
.auth-msg{margin-top:.9rem;font-size:12px;text-align:center;min-height:18px}
.auth-msg.error{color:#f08070}
.auth-msg.loading{color:rgba(255,255,255,.45)}

/* ── 본문 ── */
.wrap{width:100%;max-width:680px;padding:1.4rem 2rem 0}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:.85rem;color:rgba(16,185,129,.6)}
.sec-label::after{content:'';flex:1;height:1px;background:rgba(16,185,129,.15)}

.now{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.25);border-radius:11px;padding:13px 15px;margin-bottom:1.5rem}
.now.done{background:rgba(16,185,129,.16);border:1.5px solid var(--green)}
.now.off{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1)}
.now-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.now-week{font-size:15px;font-weight:700;color:#fff}
.now-who{font-size:13px;color:rgba(255,255,255,.6)}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:11px;padding:4px 10px;border-radius:5px;border:none;font-family:inherit;cursor:pointer}
.badge.warn{background:rgba(245,197,99,.14);color:var(--amber)}
.badge.danger{background:rgba(224,80,64,.14);color:#f08070}
.badge.mute{background:rgba(255,255,255,.05);color:rgba(255,255,255,.4)}
.badge:hover{filter:brightness(1.25)}
.now-done{display:flex;align-items:center;gap:10px}
.now-done-ic{width:26px;height:26px;border-radius:50%;background:var(--green);color:#04241b;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:900}
.now-done-t{font-size:14px;font-weight:700;color:var(--green2)}
.now-done-s{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}

.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.pick button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:99px;font-size:12px;font-family:inherit;padding:5px 13px;cursor:pointer;color:rgba(255,255,255,.5)}
.pick button[aria-pressed="true"]{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.5);color:var(--green2)}

.course{padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.course-code{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:rgba(16,185,129,.7)}
.course-name{font-size:19px;font-weight:700;color:#fff;margin-top:3px}
.course-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px}

.tabs{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;top:1px;background:none;font-size:12.5px;font-family:inherit;color:rgba(255,255,255,.42);padding:7px 15px;cursor:pointer;white-space:nowrap;border:1px solid transparent;border-radius:8px 8px 0 0}
.tabs button:hover{color:rgba(255,255,255,.7)}
.tabs button[aria-selected="true"]{color:#9FE1CB;font-weight:500;background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.3);border-bottom-color:rgba(16,185,129,.13)}
.tdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin-left:7px;vertical-align:2px}
.tdot.hot{background:#e24b4a}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;min-height:0}
.chip{font-size:11px;padding:3px 10px;border-radius:5px;background:rgba(16,185,129,.14);color:var(--green2)}
.chip.mute{background:transparent;color:rgba(255,255,255,.3);padding-left:0}
.saved{margin-left:auto;font-size:11px;color:var(--green2);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.err{display:none;background:rgba(200,57,43,.08);border:1px solid rgba(200,57,43,.25);border-radius:8px;padding:10px 13px;font-size:12px;color:#f08070;line-height:1.6;margin-bottom:11px}
.err.show{display:block}

.grid{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}
.row{border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.row.open{background:rgba(16,185,129,.05)}
.row.off{background:rgba(255,255,255,.02)}
.row.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--green)}100%{box-shadow:inset 0 0 0 2px transparent}}
.row-head{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer}
.row.off .row-head{cursor:default}
.row-idx{font-size:12px;color:rgba(255,255,255,.35);flex-shrink:0;min-width:74px}
.row-who{font-size:13px;flex:1;min-width:0;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.open .row-who{color:#fff}
.row.off .row-idx,.row.off .row-who{color:rgba(255,255,255,.22)}
.tag{font-size:10px;background:rgba(16,185,129,.16);color:var(--green2);padding:2px 7px;border-radius:4px;margin-left:5px}
.cnt{font-size:11px;flex-shrink:0}
.cnt.ok{color:var(--green2)}.cnt.part{color:var(--amber)}.cnt.no{color:rgba(255,255,255,.3)}
.cnt.sub{margin-left:9px}
.ghead{display:flex;align-items:center;gap:9px}
.gicon{color:var(--green2);flex:none}
.gsum{flex:1;min-width:0;font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.5}
.gtoggle{flex:none;font-family:inherit;font-size:11px;padding:4px 11px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.55);cursor:pointer}
.gtoggle:hover{background:rgba(255,255,255,.12)}
.gchip{flex:none;font-size:10.5px;padding:3px 9px;border-radius:5px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.42)}
.gchip.warn{background:rgba(245,197,99,.14);color:var(--amber)}
.gchip.ok{background:rgba(16,185,129,.16);color:var(--green2)}
.gbody{margin-top:9px;padding-top:4px;border-top:1px solid rgba(255,255,255,.08)}
.add-wk{margin-top:10px}
.aw-btn{font-family:inherit;font-size:12px;padding:9px 16px;width:100%;border-radius:9px;background:rgba(16,185,129,.07);border:1px dashed rgba(16,185,129,.32);color:var(--green2);cursor:pointer}
.aw-btn:hover{background:rgba(16,185,129,.15);border-style:solid}
.aw-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.aw-list button{font-family:inherit;font-size:11.5px;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.7);cursor:pointer}
.aw-list button:hover{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.4);color:#fff}
.aw-list button:disabled{opacity:.5;cursor:default}
.row-body{padding:0 14px 13px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px 16px;margin-bottom:13px}
.checks label{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.8);cursor:pointer}
.checks input{width:14px;height:14px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.checks input:disabled{cursor:default}
.checks label.dim{color:rgba(255,255,255,.5)}
.texts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.texts label{display:block;font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px}
.texts input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px;font-size:12px;font-family:inherit;color:#fff;outline:none}
.texts input:focus{border-color:rgba(16,185,129,.5)}
.texts input:disabled{color:rgba(255,255,255,.4)}
.autos{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-top:11px;border-top:1px dashed rgba(255,255,255,.1)}
.auto{font-size:11px;padding:3px 9px;border-radius:5px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.3)}
.auto.got{background:rgba(16,185,129,.14);color:var(--green2)}
.auto-note{font-size:11px;color:rgba(255,255,255,.25)}

.forms{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px;padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px}
.dl-label{font-size:11px;color:rgba(255,255,255,.35);margin-right:2px}
.dl{font-size:11px;color:var(--green2);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:5px;padding:3px 9px;text-decoration:none}
.dl:hover{background:rgba(16,185,129,.2)}
.dl-note{font-size:11px;color:rgba(255,255,255,.25);width:100%}
.guide{margin:0 0 11px;padding:13px 15px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.3);border-radius:0 10px 10px 10px}
.gstep{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.gstep+.gstep{border-top:1px solid rgba(255,255,255,.06)}
.gn{flex:none;width:19px;height:19px;margin-top:1px;border-radius:50%;background:rgba(16,185,129,.2);color:var(--green2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gtext{display:flex;flex-direction:column;gap:4px;min-width:0}
.gtext>b{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.82)}
.gs-sub{font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.42)}
.guide-files{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 1px}
.gf{font-size:11px;padding:3px 9px;border-radius:5px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.5)}
.gf b{color:var(--green2);font-weight:700;margin-right:3px}
.guide code{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6)}
.submit-btn{margin-left:auto;font-size:11px;font-family:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.35);border-radius:6px;padding:5px 12px;cursor:default}
.up-btn{margin-left:auto;font-size:11px;font-family:inherit;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);color:var(--green2);border-radius:6px;padding:5px 12px;cursor:pointer}
.up-btn:hover{background:rgba(16,185,129,.24)}
.up-btn:disabled{opacity:.6;cursor:default}
.fd-btn{margin-left:auto}
.sc-btn{margin-left:0;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.5)}
.sc-btn:hover{background:rgba(255,255,255,.12)}
.rs-btn{margin-left:0;background:rgba(226,75,74,.12);border-color:rgba(226,75,74,.35);color:#f09595}
.rs-btn:hover{background:rgba(226,75,74,.22)}
.rs-btn.all{background:rgba(226,75,74,.22);border-color:rgba(226,75,74,.55);color:#f7c1c1}
.rs-btn.all:hover{background:rgba(226,75,74,.34)}
button.auto{font-family:inherit;border:1px dashed rgba(16,185,129,.3);background:rgba(16,185,129,.06);color:var(--green2);cursor:pointer}
button.auto:hover{background:rgba(16,185,129,.16);border-style:solid}
button.auto:disabled{opacity:.6;cursor:default}
.plus{opacity:.6;margin-left:2px}
.up-btn.busy,button.auto.busy{background:rgba(245,197,99,.16);border-color:rgba(245,197,99,.45);color:#f5c563;border-style:solid}
.up-btn.done,button.auto.done{background:rgba(16,185,129,.28);border-color:var(--green);color:#d1fae5;border-style:solid}
.memo{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 18px;margin-bottom:11px}
.memo h3{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px}
.memo .hint{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:9px;line-height:1.6}
.memo textarea{width:100%;min-height:110px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:#fff;line-height:1.7;outline:none;resize:vertical}
.memo textarea:focus{border-color:rgba(16,185,129,.5)}

.by{font-size:11px;color:rgba(255,255,255,.3);margin-top:7px}
.add-sec{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.add-sec input{flex:1;min-width:200px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:#fff;outline:none}
.add-sec input:focus{border-color:rgba(16,185,129,.5);border-style:solid}
.add-sec button{background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);color:var(--green2);border-radius:8px;font-size:13px;font-family:inherit;padding:0 18px;cursor:pointer}
.add-sec button:disabled{opacity:.5;cursor:default}
a.top-btn{text-decoration:none;display:inline-flex;align-items:center}
.empty{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:2.5rem 1.5rem;text-align:center;font-size:13px;color:rgba(255,255,255,.3);line-height:1.7}
.footer{width:100%;padding:1.4rem 1.5rem;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px 16px;font-size:11px;color:rgba(255,255,255,.35);margin-top:2rem}

@media(max-width:820px){
  .header{padding:2rem 1.4rem 0;gap:16px}
  .main-msg,.wrap{padding-left:1.4rem;padding-right:1.4rem}
}
@media(max-width:600px){

}

<script>
'use strict';
var GAS = 'https://script.google.com/macros/s/AKfycbz-RfQ4-4xNSY4TZS1Mx31qEogYpvKTRZ7aqQVV3csrUDCJlC6u05rNaCs7j-mlQPZo/exec';
var AUTH_KEY = 'kistar_auth_hub';
var EXPIRE_MS = 1000 * 60 * 60 * 24 * 120;

var auth = null, role = 'ta', courses = [], cur = null;
var curKind = 'week', editMode = false, timers = {}, summary = null, forms = [];
var keepOpen = {};   // '연사|12' → true. 목록을 다시 그려도 펼침을 유지한다
var viewAs = '', tas = [], isAdmin = false;   // 조교 시점 보기
var cache = {};

var CHIP = '<svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">'
+ '<rect x="13" y="13" width="46" height="46" rx="8" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="2"/>'
+ '<g stroke="#10b981" stroke-width="1.8" stroke-linecap="round">'
+ '<line x1="24" y1="13" x2="24" y2="6"/><line x1="36" y1="13" x2="36" y2="6"/><line x1="48" y1="13" x2="48" y2="6"/>'
+ '<line x1="24" y1="59" x2="24" y2="66"/><line x1="36" y1="59" x2="36" y2="66"/><line x1="48" y1="59" x2="48" y2="66"/>'
+ '<line x1="13" y1="24" x2="6" y2="24"/><line x1="13" y1="36" x2="6" y2="36"/><line x1="13" y1="48" x2="6" y2="48"/>'
+ '<line x1="59" y1="24" x2="66" y2="24"/><line x1="59" y1="36" x2="66" y2="36"/><line x1="59" y1="48" x2="66" y2="48"/></g>'
+ '<rect x="22" y="22" width="28" height="28" rx="5" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1"/>'
+ '<circle cx="28" cy="28" r="2" fill="#10b981" opacity=".45"/><circle cx="44" cy="28" r="2" fill="#10b981" opacity=".45"/>'
+ '<circle cx="28" cy="44" r="2" fill="#10b981" opacity=".45"/><circle cx="44" cy="44" r="2" fill="#10b981" opacity=".45"/>'
+ '<circle cx="36" cy="36" r="7" fill="rgba(200,57,43,0.2)" stroke="#c8392b" stroke-width="1"/>'
+ '<text x="36" y="39.5" text-anchor="middle" font-size="8" font-weight="900" fill="#e05040" font-family="Arial,sans-serif">KU</text></svg>';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function call(params){
  return new Promise(function(res, rej){
    var cb = 'hub_' + Math.random().toString(36).slice(2);
    var s = document.createElement('script');
    var t = setTimeout(function(){ done(); rej(new Error('응답이 없습니다. 잠시 뒤 다시 시도하세요.')); }, 25000);
    function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function(d){ done(); res(d); };
    s.onerror = function(){ done(); rej(new Error('연결에 실패했습니다.')); };
    var q = [];
    for (var k in params){
      if (!params.hasOwnProperty(k)) continue;
      var v = params[k] == null ? '' : params[k];
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    }
    q.push('callback=' + cb);
    s.src = GAS + '?' + q.join('&');
    document.body.appendChild(s);
  });
}
function post(params){
  // form_plan.html 의 서명 업로드와 같은 방식 (URLSearchParams POST)
  var body = new URLSearchParams();
  for (var k in params){
    if (!params.hasOwnProperty(k)) continue;
    body.append(k, params[k] == null ? '' : params[k]);
  }
  return fetch(GAS, { method:'POST', body: body }).then(function(r){ return r.json(); });
}

function withAuth(o){
  o.userId = auth.id; o.userPw = auth.pw;
  if (viewAs) o.viewAs = viewAs;              // 조교 시점 보기 (관리자만)
  else if (role === 'admin' && editMode) o.edit = '1';
  return o;
}
function showErr(t){ var e = $('err'); e.textContent = t || ''; e.className = 'err' + (t ? ' show' : ''); }
var savedT = null;
function flagSaved(at){
  var el = $('saved'); if (!el) return;
  el.textContent = '저장됨 ' + (at || '');
  el.classList.add('on');
  clearTimeout(savedT);
  savedT = setTimeout(function(){ el.classList.remove('on'); }, 2500);
}

/* ── 로그인 ── */
$('authChip').innerHTML = CHIP;
$('mainChip').innerHTML = CHIP;

function readAuth(){
  try {
    var v = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if (!v || !v.id || !v.pw) return null;
    if (v.at && Date.now() - v.at > EXPIRE_MS){ localStorage.removeItem(AUTH_KEY); return null; }
    return v;
  } catch(e){ return null; }
}
function openAuth(){ $('auth').classList.add('show'); $('page').hidden = true; }

$('pwBtn').addEventListener('click', function(){
  var i = $('apw');
  i.type = i.type === 'password' ? 'text' : 'password';
});
$('authBtn').addEventListener('click', doAuth);
$('apw').addEventListener('keydown', function(e){ if (e.key === 'Enter') doAuth(); });
$('aid').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('apw').focus(); });

function doAuth(){
  var id = $('aid').value.trim();
  var pw = $('apw').value.trim();
  var m = $('authMsg');
  if (!id || !pw){ m.className = 'auth-msg error'; m.textContent = '학번과 생년월일을 모두 넣으세요.'; return; }
  m.className = 'auth-msg loading'; m.textContent = '확인 중…';
  $('authBtn').disabled = true;
  login(id, pw).catch(function(e){
    m.className = 'auth-msg error'; m.textContent = e.message;
  }).then(function(){ $('authBtn').disabled = false; });
}

function login(id, pw, silent){
  return call({ action:'hubLogin', userId:id, userPw:pw, viewAs:viewAs,
                ua:navigator.userAgent })
    .then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '로그인하지 못했습니다.');
      auth = { id:id, pw:pw, at:Date.now() };
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch(e){}
      role = d.role; courses = d.courses || []; forms = d.forms || [];
      if (d.tas) tas = d.tas;
      isAdmin = (d.role === 'admin' || !!d.admin);
      start(d);
    }).catch(function(e){
      if (silent){ try{ localStorage.removeItem(AUTH_KEY); }catch(x){} openAuth(); }
      throw e;
    });
}

/* ══ 조교 시점 보기 ═══════════════════════════════
   관리자가 특정 조교의 화면을 그대로 본다. 편집은 막혀 있다.
   서버에서 관리자 인증을 다시 확인하므로 화면만 바꿔치기할 수 없다. */

function setViewAs(id){
  viewAs = id || '';
  cache = {}; keepOpen = {}; cur = null; editMode = false;
  $('pick').hidden = true; $('pick').innerHTML = '';
  $('btnEdit').classList.remove('on');
  $('btnEdit').textContent = '편집 모드';
  login(auth.id, auth.pw).catch(function(e){ showErr(e.message); });
}

function askViewAs(){
  var box = $('asBox');
  if (box){ box.remove(); return; }
  box = document.createElement('div');
  box.id = 'asBox';
  box.className = 'as-box';
  box.innerHTML = '<div class="as-t">어느 조교 화면으로 볼까요</div>'
    + tas.map(function(t){
        return '<button type="button" data-id="' + esc(t.id) + '"'
          + (t.id === viewAs ? ' class="on"' : '') + '>' + esc(t.who) + '</button>';
      }).join('')
    + (viewAs ? '<button type="button" class="as-off" data-id="">관리자 화면으로 돌아가기</button>' : '');
  box.onclick = function(e){
    var b = e.target.closest('button[data-id]'); if (!b) return;
    box.remove();
    setViewAs(b.dataset.id);
  };
  $('btnAs').parentNode.appendChild(box);
}

$('btnOut').addEventListener('click', function(){
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  auth = null; courses = []; cur = null; editMode = false;
  viewAs = ''; tas = []; isAdmin = false;
  $('btnAs').hidden = true; $('btnEdit').hidden = true;
  $('apw').value = '';
  $('authMsg').textContent = '';
  openAuth();
});

/* ── 시작 ── */
var LABEL = { ta:'TA', prof:'교수', admin:'ADMIN' };

function start(d){
  $('auth').classList.remove('show');
  $('page').hidden = false;
  $('topRole').textContent = viewAs ? '조교 시점' : (LABEL[role] || 'TA');
  $('topRole').classList.toggle('as', !!viewAs);
  $('topWho').dataset.who = d.who || '';
  if (d.semester) $('authSub').textContent = d.semester + ' · 교직원 · 조교 전용 화면입니다';

  if (isAdmin){
    $('btnHub').hidden = false;
    $('btnAs').hidden = false;
    $('btnAs').onclick = askViewAs;
    $('btnAs').classList.toggle('on', !!viewAs);
    $('btnAs').textContent = viewAs ? '시점 해제' : '조교 시점';
  }
  // 조교 시점에서는 조교와 똑같이 바로 편집된다 — 편집 모드 버튼이 필요 없다
  if (role === 'admin' && !viewAs){
    $('btnEdit').hidden = false;
    $('btnEdit').onclick = function(){
      editMode = !editMode;
      this.classList.toggle('on', editMode);
      this.textContent = editMode ? '편집 중' : '편집 모드';
      cache = {};                 // 편집 권한이 바뀌므로 받아둔 내용을 버린다
      openKind(curKind);
      prefetch(cur);
    };
  } else {
    $('btnEdit').hidden = true;
  }
  if (courses.length > 1){
    var p = $('pick');
    p.innerHTML = courses.map(function(c, i){
      return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(c.name) + '</button>';
    }).join('');
    p.hidden = false;
    p.onclick = function(e){
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call(p.children, function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      selectCourse(courses[+b.dataset.i]);
    };
  }
  selectCourse(courses[0]);
}

function selectCourse(c){
  if (!c){ $('view').innerHTML = '<div class="empty">담당 과목이 없습니다.</div>'; return; }
  if (!cur || cur.code !== c.code) keepOpen = {};   // 과목마다 행 번호가 다르다
  cur = c;
  $('cCode').textContent = '3학점 · ' + c.code;
  $('cName').textContent = c.name;
  $('cSub').textContent = [c.prof ? c.prof + ' 교수' : '', c.time, c.room].filter(Boolean).join(' · ');
  var me = $('topWho').dataset.who || '';
  $('topWho').textContent = (role === 'admin')
    ? [me, courses.length + '과목'].filter(Boolean).join(' · ')
    : [me, c.name, c.prof ? c.prof + ' 교수' : ''].filter(Boolean).join(' · ');

  var list = [{ k:'week', t:'주차별 준비' }];
  if (c.tabs.speaker) list.push({ k:'speaker', t:'연사 서류' });
  if (c.tabs.extra){
    var sfx = (c.tabs.extra.split('_')[1] || '부가');
    list.push({ k:'extra', t: sfx === '안전' ? '실습 안전' : sfx === '팀' ? '팀 관리' : sfx });
  }
  if (c.tabs.memo) list.push({ k:'memo', t:'인수인계 메모' });

  $('tabs').innerHTML = list.map(function(x){
    return '<button type="button" role="tab" data-k="' + x.k + '" aria-selected="false">'
      + esc(x.t) + '<span class="tdot" data-k="' + x.k + '" hidden></span></button>';
  }).join('');
  loadBadges();
  $('tabs').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    openKind(b.dataset.k);
  };
  cache = {};
  loadNow();
  openKind('week');
  prefetch(c);
}

/* ── 이번 주 ── */
function loadNow(){
  $('nowWrap').hidden = true;
  return call(withAuth({ action:'getTaSummary', code:cur.code })).then(function(d){
    if (!d || !d.ok || d.empty) return;
    summary = d;
    var box = $('now');
    var head = '<div class="now-head"><span class="now-week">' + esc(d.week + ' ' + d.date) + '</span>'
             + '<span class="now-who">' + esc([d.who, d.speaker, d.org].filter(Boolean).join(' · ')) + '</span></div>';
    if (d.off){
      box.className = 'now off';
      box.innerHTML = head + '<div class="badges"><span class="badge mute">휴강 주간입니다</span></div>';
    } else if (d.done){
      box.className = 'now done';
      box.innerHTML = head
        + '<div class="now-done"><span class="now-done-ic">✓</span><div>'
        + '<div class="now-done-t">이번 주 준비 완료</div>'
        + '<div class="now-done-s">수업 준비와 제출 서류를 모두 끝냈습니다</div></div></div>';
    } else {
      box.className = 'now';
      box.innerHTML = head + '<div class="badges">' + d.badges.map(function(b){
        return '<button type="button" class="badge ' + b.tone + '" data-go="' + b.kind + '">' + esc(b.text) + '</button>';
      }).join('') + '</div>';
      box.onclick = function(e){
        var b = e.target.closest('.badge[data-go]'); if (!b) return;
        goTo(b.dataset.go);
      };
    }
    $('nowWrap').hidden = false;
  }).catch(function(){});
}

function goTo(kind){
  var target = kind === 'speaker' ? summary.speakerRow : summary.row;
  openKind(kind).then(function(){
    var el = $('view').querySelector('.row[data-r="' + target + '"]');
    if (!el) return;
    var body = el.querySelector('.row-body');
    if (body && body.hidden){ body.hidden = false; el.classList.add('open'); }
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  });
}

/* ── 탭 ── */
function openKind(kind){
  curKind = kind;
  Array.prototype.forEach.call($('tabs').children, function(b){
    b.setAttribute('aria-selected', String(b.dataset.k === kind));
  });
  showErr('');
  $('bar').innerHTML = '<span class="chip mute">불러오는 중…</span>';
  $('view').innerHTML = '';
  var job = (kind === 'memo') ? loadMemo() : loadGrid(kind);
  return job.catch(function(e){ $('bar').innerHTML = ''; showErr(e.message); });
}

function prefetch(c){
  ['speaker','extra'].forEach(function(k){
    if (!c.tabs[k]) return;
    call(withAuth({ action:'getTaGrid', code:c.code, kind:k })).then(function(d){
      if (d && d.ok) cache[c.code + '|' + k] = d;
    }).catch(function(){});
  });
  if (c.tabs.memo){
    call(withAuth({ action:'getTaMemo', code:c.code })).then(function(d){
      if (d && d.ok) cache[c.code + '|memo'] = d;
    }).catch(function(){});
  }
}

function loadGrid(kind){
  var hit = cache[cur.code + '|' + kind];
  if (hit){ paintGrid(hit); return Promise.resolve(); }
  return call(withAuth({ action:'getTaGrid', code:cur.code, kind:kind })).then(function(d){
    if (!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했습니다.');
    cache[cur.code + '|' + kind] = d;
    paintGrid(d);
  });
}

function paintGrid(d){
  if (d.empty || !d.rows.length){
    $('bar').innerHTML = '<span class="saved" id="saved"></span>';
    $('view').innerHTML = guideBlock(!d.canEdit, -1) + formBlock()
      + '<div class="empty">아직 등록된 줄이 없습니다.'
      + (d.kind === 'speaker' && d.canEdit
          ? '<br>연사 초청이 잡히면 아래에서 주차를 더하세요.'
          : '<br>사업단에서 내용을 채우면 여기에 나타납니다.')
      + '</div>'
      + addSpeakerBlock(d);
    bindGuide();
    bindAddSpeaker(d);
    return;
  }
  renderGrid(d);
}

/** 연사 주차 추가 — 주차 탭에 있고 연사 탭에 없는 강의일만 고르게 한다 */
function addSpeakerBlock(d){
  if (d.kind !== 'speaker' || !d.canEdit) return '';
  var list = d.addable || [];
  if (!list.length) return '';
  return '<div class="add-wk">'
    + '<button type="button" class="aw-btn">＋ 연사 주차 추가</button>'
    + '<div class="aw-list" hidden>' + list.map(function(x){
        return '<button type="button" data-w="' + esc(x.week) + '" data-d="' + esc(x.date) + '">'
          + esc(x.week + ' ' + x.date) + '</button>';
      }).join('') + '</div></div>';
}

function bindAddSpeaker(d){
  var box = $('view').querySelector('.add-wk');
  if (!box) return;
  box.onclick = function(e){
    var open = e.target.closest('.aw-btn');
    if (open){
      var l = box.querySelector('.aw-list');
      l.hidden = !l.hidden;
      open.textContent = l.hidden ? '＋ 연사 주차 추가' : '취소';
      return;
    }
    var pick = e.target.closest('.aw-list button');
    if (!pick) return;
    pick.disabled = true;
    call(withAuth({ action:'addTaSpeaker', code:cur.code,
                    week:pick.dataset.w, date:pick.dataset.d }))
      .then(function(r){
        if (!r || !r.ok) throw new Error((r && r.error) || '추가하지 못했습니다.');
        showErr('');
        flagSaved(r.week + ' 추가');
        delete cache[cur.code + '|speaker'];
        keepOpen['speaker|' + r.row] = true;
        openKind('speaker');
      })
      .catch(function(err){ pick.disabled = false; showErr(err.message); });
  };
}

/**
 * 제출 초기화 — 관리자 편집 모드 전용.
 *   서류 초기화   올린 파일과 제출 표시만
 *   전체 되돌리기 체크·입력칸까지 (되살릴 수 없다)
 * 파일은 어느 쪽이든 드라이브 휴지통으로 간다.
 */
function resetRow(kind, row, btn, all){
  var el = btn.closest('.row');
  var who = el ? el.querySelector('.row-idx').textContent.trim()
                 + ' ' + el.querySelector('.row-who').textContent.trim() : '이 주차';
  var msg = all
    ? who + '\n\n체크·입력칸·제출 표시를 모두 비우고 올린 파일도 지웁니다.\n'
      + '파일은 휴지통에서 되살릴 수 있지만 체크와 메모는 되살릴 수 없습니다.\n\n계속할까요?'
    : who + '\n\n올린 파일과 제출 표시를 지웁니다. 체크와 입력칸은 그대로 둡니다.\n'
      + '파일은 드라이브 휴지통으로 가므로 되살릴 수 있습니다.\n\n계속할까요?';
  if (!confirm(msg)) return;

  btn.disabled = true;
  var back = btn.textContent;
  btn.textContent = '지우는 중…';
  keepOpen[kind + '|' + row] = true;
  var y = window.scrollY;
  call(withAuth({ action:'resetTaRow', code:cur.code, kind:kind, row:row,
                  scope: all ? 'all' : '' }))
    .then(function(d){
      btn.disabled = false; btn.textContent = back;
      if (!d || !d.ok){ showErr((d && d.error) || '초기화하지 못했습니다.'); return; }
      showErr('');
      flagSaved('파일 ' + d.files + '개 · 표시 ' + d.cleared + '건'
                + (d.wiped ? ' · 입력 ' + d.wiped + '건' : '') + ' 지움');
      delete cache[cur.code + '|' + kind];
      openKind(kind).then(function(){ window.scrollTo(0, y); loadNow(); });
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = back;
      showErr(e.message);
    });
}

/** 안내 상자 접기 — 격자가 없는 화면에서도 눌리게 한다 */
function bindGuide(){
  var v = $('view');
  var gt = v.querySelector('.gtoggle');
  if (!gt) return;
  gt.onclick = function(){
    guideOpen = !guideOpen;
    var body = v.querySelector('.gbody');
    if (body) body.hidden = !guideOpen;
    gt.textContent = guideOpen ? '접기' : '자세히';
  };
}

function renderGrid(d){
  var cols = d.cols, rows = d.rows, ro = !d.canEdit;
  var fixed = cols.filter(function(c){ return c.role === 'fixed'; });
  var checks = cols.filter(function(c){ return c.role === 'check'; });
  var texts = cols.filter(function(c){ return c.role === 'text'; });
  var autos = cols.filter(function(c){ return c.role === 'auto'; });
  var nowRow = (summary && !summary.empty)
    ? (curKind === 'speaker' ? summary.speakerRow : summary.row) : -1;

  var left = 0;
  var html = rows.map(function(r){
    var vals = fixed.map(function(c){ return String(r.v[c.col] || ''); });
    var off = vals.join(' ').indexOf('휴강') >= 0;
    var done = 0;
    checks.forEach(function(c){ if (String(r.v[c.col] || '').trim()) done++; });
    if (!off && checks.length && done < checks.length) left++;

    var got = 0;
    autos.forEach(function(c){ if (String(r.v[c.col] || '').trim()) got++; });
    var subCnt = (off || !autos.length) ? ''
      : '<span class="cnt sub ' + (got === autos.length ? 'ok' : got ? 'part' : 'no') + '">제출 '
        + got + '/' + autos.length + '</span>';

    var head = '<div class="row-head">'
      + '<span class="row-idx">' + esc(vals.slice(0, 2).join(' ')) + '</span>'
      + '<span class="row-who">' + esc(vals.slice(2).join(' ') || '—')
      + (r.row === nowRow && !off ? '<span class="tag">이번 주</span>' : '') + '</span>'
      + (off ? '<span class="cnt no">휴강</span>'
             : (checks.length ? '<span class="cnt ' + (done === checks.length ? 'ok' : done ? 'part' : 'no') + '">준비 '
                 + done + '/' + checks.length + '</span>' : '') + subCnt)
      + '</div>';
    if (off) return '<div class="row off" data-r="' + r.row + '">' + head + '</div>';

    var body = '<div class="row-body" hidden>';
    if (checks.length){
      body += '<div class="checks">' + checks.map(function(c){
        var on = String(r.v[c.col] || '').trim() ? ' checked' : '';
        return '<label' + (on ? '' : ' class="dim"') + '><input type="checkbox" data-row="' + r.row
          + '" data-col="' + c.col + '"' + on + (ro ? ' disabled' : '') + '>' + esc(c.label) + '</label>';
      }).join('') + '</div>';
    }
    if (texts.length){
      body += '<div class="texts">' + texts.map(function(c){
        var id = 't' + r.row + '_' + c.col;
        return '<div><label for="' + id + '">' + esc(c.label) + '</label>'
          + '<input id="' + id + '" type="text" value="' + esc(r.v[c.col] || '')
          + '" data-row="' + r.row + '" data-col="' + c.col + '"' + (ro ? ' disabled' : '') + '></div>';
      }).join('') + '</div>';
    }
    if (autos.length){
      body += '<div class="autos">' + autos.map(function(c){
        var got = String(r.v[c.col] || '').trim();
        return '<span class="auto' + (got ? ' got' : '') + '">' + esc(c.label) + (got ? ' ' + esc(got) : '') + '</span>';
      }).join('')
        + '<button type="button" class="up-btn fd-btn" data-row="' + r.row + '">폴더 열기</button>'
        + '<button type="button" class="up-btn sc-btn" data-row="' + r.row + '">제출 확인</button>'
        + (role === 'admin' && !viewAs && editMode
            ? '<button type="button" class="up-btn rs-btn" data-row="' + r.row + '">서류 초기화</button>'
              + '<button type="button" class="up-btn rs-btn all" data-row="' + r.row + '">전체 되돌리기</button>'
            : '')
        + '</div>';
    }
    body += '</div>';
    return '<div class="row" data-r="' + r.row + '">' + head + body + '</div>';
  }).join('');

  $('bar').innerHTML = '<span class="saved" id="saved"></span>';
  $('view').innerHTML = guideBlock(ro, checks.length ? left : -1)
    + formBlock() + '<div class="grid">' + html + '</div>'
    + addSpeakerBlock(d);
  bindAddSpeaker(d);

  var view = $('view');
  Array.prototype.forEach.call(view.querySelectorAll('.row:not(.off)'), function(el){
    el.querySelector('.row-head').addEventListener('click', function(ev){
      if (ev.target.closest('button')) return;
      var b = el.querySelector('.row-body');
      if (!b) return;
      b.hidden = !b.hidden;
      el.classList.toggle('open', !b.hidden);
      // 「제출 확인」 뒤 목록을 다시 그려도 열어둔 줄이 닫히지 않게 기억한다
      keepOpen[curKind + '|' + el.dataset.r] = !b.hidden;
    });
    if (+el.dataset.r === nowRow || keepOpen[curKind + '|' + el.dataset.r]){
      var b = el.querySelector('.row-body');
      if (b){ b.hidden = false; el.classList.add('open'); }
    }
  });

  view.onclick = function(e){
    var gt = e.target.closest('.gtoggle');
    if (gt){
      guideOpen = !guideOpen;
      var body = view.querySelector('.gbody');
      if (body) body.hidden = !guideOpen;
      gt.textContent = guideOpen ? '접기' : '자세히';
      return;
    }
    var fd = e.target.closest('.fd-btn');
    if (fd){ openFolder(curKind, +fd.dataset.row, fd); return; }
    var sc = e.target.closest('.sc-btn');
    if (sc){ scanFolder(curKind, +sc.dataset.row, sc); return; }
    var rs = e.target.closest('.rs-btn');
    if (rs){ resetRow(curKind, +rs.dataset.row, rs, rs.classList.contains('all')); return; }
  };
  view.onchange = function(e){
    var t = e.target;
    if (t.type !== 'checkbox') return;
    t.closest('label').classList.toggle('dim', !t.checked);
    saveCell(t.dataset.row, t.dataset.col, t.checked ? 'O' : '', t);
  };
  view.oninput = function(e){
    var t = e.target;
    if (t.type !== 'text') return;
    var key = t.dataset.row + '_' + t.dataset.col;
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function(){ saveCell(t.dataset.row, t.dataset.col, t.value, t); }, 2000);
  };
}

/* ══ 제출 서류 — 구글 드라이브 폴더 ══════════════════════════
   파일을 GAS로 보내지 않는다. 조교가 폴더를 열어 직접 끌어다 놓는다.
   GAS 를 거치면 base64 로 부풀려 두 번 이동해야 해서 13MB 에 1분이 걸렸다.
   폴더 방식은 구글 드라이브 속도 그대로다.
   시트 표시는 「제출 확인」 버튼으로 폴더를 훑어 채운다.        */

function openFolder(kind, row, btn){
  // 팝업 차단을 피하려면 빈 탭을 먼저 열고 주소를 나중에 넣어야 한다
  var w = window.open('', '_blank');
  btn.disabled = true;
  var back = btn.textContent;
  btn.textContent = '여는 중…';
  call(withAuth({ action:'getTaFolder', code:cur.code, kind:kind, row:row }))
    .then(function(d){
      btn.disabled = false; btn.textContent = back;
      if (!d || !d.ok){
        if (w) w.close();
        showErr((d && d.error) || '폴더를 열지 못했습니다.');
        return;
      }
      showErr('');
      if (w) w.location.href = d.url;
      else location.href = d.url;
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = back;
      if (w) w.close();
      showErr(e.message);
    });
}

function scanFolder(kind, row, btn){
  btn.disabled = true;
  var back = btn.textContent;
  btn.textContent = '확인 중…';
  keepOpen[kind + '|' + row] = true;      // 확인한 줄은 다시 그려도 열어둔다
  var y = window.scrollY;
  call(withAuth({ action:'scanTaFolder', code:cur.code, kind:kind, row:row }))
    .then(function(d){
      btn.disabled = false; btn.textContent = back;
      if (!d || !d.ok){
        showErr((d && d.error) || '확인하지 못했습니다.');
        return;
      }
      showErr('');
      flagSaved(d.found ? '서류 ' + d.found + '건 확인' : '폴더가 비어 있습니다');
      delete cache[cur.code + '|' + kind];
      openKind(kind).then(function(){
        window.scrollTo(0, y);            // 화면이 맨 위로 튀지 않게 되돌린다
        loadNow();
      });
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = back;
      showErr(e.message);
    });
}

function formBlock(){
  if (curKind !== 'week' && curKind !== 'speaker') return '';
  var mine = forms.filter(function(f){
    return curKind === 'speaker' ? f.no > 0 : !f.no;
  });
  var has = mine.filter(function(f){ return !!f.url; });
  if (!has.length) return '';
  var links = has.map(function(f){
    return '<a class="dl" href="' + esc(f.url) + '" target="_blank" rel="noopener">'
      + (f.mark ? esc(f.mark) + ' ' : '') + esc(f.name) + '</a>';
  }).join('');
  // 지정 양식이 없는 서류는 _양식 탭에서 링크가 빈 줄로 관리한다
  var none = mine.filter(function(f){ return !f.url; });
  var extra = none.length
    ? '<span class="dl-note">' + none.map(function(f){
        return (f.mark ? f.mark + ' ' : '') + esc(f.name);
      }).join(' · ') + '는 지정 양식이 없습니다</span>'
    : '';
  return '<div class="forms"><span class="dl-label">양식 받기</span>' + links + extra + '</div>';
}

/* ══ 탭 안내 · 배지 ══════════════════════════════
   조교가 「이 탭에서 뭘 하는 곳인가」를 먼저 알아야 한다.
   한 줄 요약은 늘 보이고, 자세한 절차는 접어 둔다.        */

var TAB_GUIDE = {
  week:    '수업 준비 사항 체크 · 대학원생 활용일지와 수업사진 제출',
  speaker: '연사 관련 서류 7가지 제출 (연사 초청 주차만)',
  extra:   '과목별 부가 항목 기록',
  memo:    '다음 조교에게 남길 내용 · 수시로 작성'
};
var EXTRA_GUIDE = {
  안전: '실습 안전 교육과 점검 사항 기록',
  팀:   '팀 편성과 팀별 진행 상황 기록'
};
function tabGuideText(){
  if (curKind !== 'extra') return TAB_GUIDE[curKind];
  var sfx = ((cur && cur.tabs.extra) || '').split('_')[1] || '';
  return EXTRA_GUIDE[sfx] || TAB_GUIDE.extra;
}
var guideOpen = false;

/** 이번 주에 할 게 남은 탭에만 점을 켠다 */
function loadBadges(){
  Array.prototype.forEach.call(document.querySelectorAll('.tdot'), function(b){
    b.hidden = true;
  });
  call(withAuth({ action:'getTaBadges', code:cur.code }))
    .then(function(d){
      if (!d || !d.ok) return;
      Object.keys(d.left || {}).forEach(function(k){
        var b = document.querySelector('.tdot[data-k="' + k + '"]');
        if (!b || !d.left[k]) return;
        b.hidden = false;
        b.className = 'tdot' + (k === 'speaker' ? ' hot' : '');
      });
    })
    .catch(function(){});
}
function guideBlock(ro, left){
  if (!TAB_GUIDE[curKind]) return '';

  var mine = forms.filter(function(f){
    return curKind === 'speaker' ? f.no > 0 : !f.no;
  });
  var sp = (curKind === 'speaker' && mine.length);

  // 주차 탭은 전 과목 공통 두 가지 — 활용일지와 수업사진
  var files = sp ? mine
    : [{ no:1, name:'대학원생 활용일지' }, { no:2, name:'수업사진 (3~5장)' }];

  var list = '<div class="guide-files">' + files.map(function(f){
      return '<span class="gf"><b>' + f.no + '.</b> ' + esc(f.name) + '</span>';
    }).join('') + '</div>'
    + '<span class="gs-sub">뒤에 이름이나 날짜를 덧붙여도 됩니다 — <code>'
    + esc(files[0].no + '. ' + files[0].name.replace(/\s*\(.*\)$/, '')
          + (sp ? '_전준현.hwp' : '_1주.hwp')) + '</code></span>'
    + (sp ? '' : '<span class="gs-sub">수업사진은 전체 학생이 나오도록 1컷, '
                 + '교수(또는 연사)가 나오도록 1컷을 반드시 넣어 주세요.</span>');

  function step(n, head, sub, extra){
    return '<div class="gstep"><span class="gn">' + n + '</span>'
      + '<div class="gtext"><b>' + head + '</b>'
      + (sub ? '<span class="gs-sub">' + sub + '</span>' : '')
      + (extra || '') + '</div></div>';
  }

  var detail;
  if (curKind === 'memo'){
    detail = '<div class="gstep"><span class="gn">·</span><div class="gtext">'
      + '<b>수시로 적어 두시면 됩니다</b>'
      + '<span class="gs-sub">항목을 눌러 바로 쓰고, 필요하면 「항목 추가」로 새 소제목을 '
      + '만듭니다. 다음 학기 조교가 이 화면을 그대로 봅니다.</span></div></div>';
  } else if (curKind === 'extra'){
    detail = '<div class="gstep"><span class="gn">·</span><div class="gtext">'
      + '<b>칸을 눌러 바로 입력하시면 됩니다</b>'
      + '<span class="gs-sub">적는 즉시 저장됩니다. 따로 저장 버튼은 없습니다.</span></div></div>';
  } else {
    detail = step(1, '「폴더 열기」를 누릅니다',
                  '처음 한 번만 권한 요청 화면이 뜹니다. 요청하시면 사업단에서 확인 후 '
                  + '수락해 드립니다.')
           + step(2, '파일 이름 앞에 번호를 붙여 폴더에 넣습니다',
                  '번호로 어느 서류인지 가려냅니다.', list)
           + step(3, '「제출 확인」을 누릅니다',
                  '아래 목록에 제출일이 바로 표시됩니다. 누르지 않으셔도 하루에 한 번 '
                  + '자동으로 반영됩니다.');
  }

  var chips = (ro ? '<span class="gchip">보기 전용</span>' : '')
    + (left > 0 ? '<span class="gchip warn">미완료 ' + left + '</span>' : '')
    + (left === 0 ? '<span class="gchip ok">모두 완료</span>' : '');

  return '<div class="guide">'
    + '<div class="ghead">'
    + '<svg class="gicon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<circle cx="8" cy="8" r="6.6" stroke="currentColor" stroke-width="1.3"/>'
    + '<path d="M8 7.2v4M8 4.9v.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
    + '<span class="gsum">' + esc(tabGuideText()) + '</span>'
    + chips
    + '<button type="button" class="gtoggle">' + (guideOpen ? '접기' : '자세히') + '</button>'
    + '</div>'
    + '<div class="gbody"' + (guideOpen ? '' : ' hidden') + '>' + detail + '</div>'
    + '</div>';
}

function saveCell(row, col, value, el){
  return call(withAuth({ action:'saveTaCell', code:cur.code, kind:curKind,
                         row:row, col:col, value:value }))
    .then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '저장하지 못했습니다.');
      showErr('');
      var g = cache[cur.code + '|' + curKind];
      if (g && g.rows) g.rows.forEach(function(r){ if (+r.row === +row) r.v[col] = d.value; });
      if (d.synced) delete cache[cur.code + '|week'];
      flagSaved(d.at + (d.synced ? ' · ' + d.synced : ''));
      refreshCount();
      loadNow();
    })
    .catch(function(e){
      showErr(e.message + ' 화면을 새로 고친 뒤 다시 시도하세요.');
      if (el && el.type === 'checkbox'){
        el.checked = !el.checked;
        el.closest('label').classList.toggle('dim', !el.checked);
      }
    });
}

function refreshCount(){
  var left = 0;
  Array.prototype.forEach.call($('view').querySelectorAll('.row:not(.off)'), function(el){
    var boxes = el.querySelectorAll('.checks input');
    if (!boxes.length) return;
    var done = 0;
    Array.prototype.forEach.call(boxes, function(b){ if (b.checked) done++; });
    var c = el.querySelector('.cnt');
    if (c){
      c.textContent = done + '/' + boxes.length;
      c.className = 'cnt ' + (done === boxes.length ? 'ok' : done ? 'part' : 'no');
    }
    if (done < boxes.length) left++;
  });
  var chip = $('bar').querySelector('.chip.mute');
  if (chip) chip.textContent = '미완료 ' + left;
}

/* ── 메모 ── */
function loadMemo(){
  var hit = cache[cur.code + '|memo'];
  if (hit){ paintMemo(hit); return Promise.resolve(); }
  return call(withAuth({ action:'getTaMemo', code:cur.code })).then(function(d){
    if (!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했습니다.');
    cache[cur.code + '|memo'] = d;
    paintMemo(d);
  });
}

function paintMemo(d){
    var secs = d.sections || [], ro = !d.canEdit;
    $('bar').innerHTML = '<span class="saved" id="saved"></span>';
    if (!secs.length){
      $('view').innerHTML = guideBlock(ro, -1) + '<div class="empty">메모 항목이 없습니다.</div>';
      return;
    }
    $('view').innerHTML = guideBlock(ro, -1) + secs.map(function(s){
      return '<section class="memo"><h3>' + esc(s.title) + '</h3>'
        + (s.hint ? '<p class="hint">' + esc(s.hint) + '</p>' : '')
        + '<textarea data-row="' + s.row + '"' + (ro ? ' disabled' : '')
        + ' placeholder="여기에 적으세요">' + esc(s.body) + '</textarea>'
        + (s.by ? '<p class="by">마지막 수정 · ' + esc(s.by) + '</p>' : '')
        + '</section>';
    }).join('')
    + (ro ? '' : '<div class="add-sec"><input type="text" id="newSec" maxlength="60"'
        + ' placeholder="새 항목 이름 (예: 실습실 열쇠 · 장비 담당자)">'
        + '<button type="button" id="addSec">항목 추가</button></div>');
    if (!ro){
      $('addSec').onclick = function(){
        var t = $('newSec').value.trim();
        if (!t) return;
        this.disabled = true;
        call(withAuth({ action:'addTaMemoSec', code:cur.code, title:t })).then(function(r){
          if (!r || !r.ok) throw new Error((r && r.error) || '추가하지 못했습니다.');
          delete cache[cur.code + '|memo'];
          openKind('memo');
        }).catch(function(e){ showErr(e.message); $('addSec').disabled = false; });
      };
    }
    var v = $('view');
    v.onchange = null;
    v.oninput = function(e){
      var t = e.target;
      if (t.tagName !== 'TEXTAREA') return;
      var key = 'memo' + t.dataset.row;
      clearTimeout(timers[key]);
      timers[key] = setTimeout(function(){ saveMemo(t.dataset.row, t.value); }, 2000);
    };
}

function saveMemo(row, value){
  return call(withAuth({ action:'saveTaMemo', code:cur.code, row:row, value:value }))
    .then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '저장하지 못했습니다.');
      delete cache[cur.code + '|memo'];
      showErr(''); flagSaved(d.at);
    })
    .catch(function(e){ showErr(e.message); });
}

/* ── 진입 ── */
(function init(){
  var s = readAuth();
  if (s) login(s.id, s.pw, true).catch(function(){});
  else openAuth();
})();
</script>
</body>
