<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이수 현황 관리 — 차세대반도체 융합전공</title>
<style>
:root{--navy:#0b1f3a;--navy2:#122440;--accent:#2563eb;--gold:#c9a84c;--bg:#f4f6f9;--card:#fff;
--text:#1a2535;--text2:#5a6a7e;--text3:#8b98a9;--border:#dde3ec;--line:#eef1f6;
--ok:#15803d;--okbg:#e8f5ec;--warn:#b45309;--warnbg:#fdf4e3;--dang:#b91c1c;--dangbg:#fbeaea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;
color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:var(--navy);color:#fff;padding:13px 26px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:60}
.top .badge{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px}
.top h1{font-weight:700;font-size:15px}
.top .meta{margin-left:auto;font-size:12px;opacity:.7}
.topnav{display:flex;gap:7px;flex-shrink:0}
.tnav{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:12px;
  text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.85);transition:all .15s}
.tnav:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);color:#fff}
.tnav.hub{border-color:var(--gold);color:var(--gold)}
.tnav.hub:hover{background:var(--gold);border-color:var(--gold);color:#fff}
@media(max-width:820px){.top .meta{display:none}.topnav{margin-left:auto}}
.wrap{max-width:1240px;margin:24px auto 80px;padding:0 20px}

/* 요약 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px 17px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--text2);margin-top:5px}
.kpi .s{font-size:11px;color:var(--text3);margin-top:3px}
.kpi.a{border-left:3px solid var(--dang)} .kpi.a .n{color:var(--dang)}
.kpi.b{border-left:3px solid var(--accent)}
.kpi.c{border-left:3px solid var(--ok)} .kpi.c .n{color:var(--ok)}
.kpi.d{border-left:3px solid #b6bfcc} .kpi.d .n{color:var(--text3)}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:0}
.tab{padding:11px 20px;border:none;background:none;cursor:pointer;font:inherit;font-size:13.5px;
font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.tab .c{font-size:11px;background:var(--bg);border-radius:20px;padding:1px 7px;margin-left:6px;color:var(--text2)}
.tab.on .c{background:var(--navy);color:#fff}

.panel{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px}
.bar{display:flex;gap:8px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
select,.q{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:13px;background:#fff;color:var(--text);outline:none}
select:focus,.q:focus{border-color:var(--accent)}
.q{flex:1;min-width:180px}
.btn{padding:7px 13px;border:1px solid var(--border);background:#fff;border-radius:6px;font:inherit;
font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.cnt{margin-left:auto;font-size:12px;color:var(--text2);white-space:nowrap}

/* 조치 목록 */
.acts{padding:6px 0}
.act{display:flex;gap:15px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.act:last-child{border-bottom:none}
.act:hover{background:#fafbfd}
.act .sev{width:4px;align-self:stretch;border-radius:2px;background:var(--text3);flex-shrink:0}
.act.s1 .sev{background:var(--dang)} .act.s2 .sev{background:#e08c2a}
.act .who{min-width:250px}
.act .nm{font-weight:700;font-size:14.5px}
.act .sub{font-size:12px;color:var(--text2);margin-top:3px}
.act .why{flex:1;min-width:0}
.act .rsn{font-size:13.5px;line-height:1.55}
.act .rsn b{color:var(--dang)}
.act .hint{font-size:12px;color:var(--text2);margin-top:4px}
.act .prog{text-align:right;white-space:nowrap;min-width:96px}
.act .prog .p1{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.act .prog .p2{font-size:11px;color:var(--text3)}
.seq{display:inline-block;background:#eef1f6;color:var(--text2);font-size:10.5px;font-weight:700;
padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums;margin-right:6px}

/* 명단 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:#f7f9fc;color:var(--text2);font-weight:600;font-size:11.5px;
padding:9px 10px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.tbl thead th.l{text-align:left}
.tbl tbody td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;
font-variant-numeric:tabular-nums}
.tbl tbody td.l{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#fafbfd}
.tbl td.div{border-left:1px solid var(--border)}
.tbl th.div{border-left:1px solid var(--border)}
.cell{display:inline-block;min-width:38px;padding:3px 0;border-radius:5px;font-weight:600}
.cell.done{background:var(--okbg);color:var(--ok)}
.cell.part{color:var(--text2)}
.cell.zero{color:#c8cfd9}
.tot{font-weight:800;font-size:14px}
.bar2{width:56px;height:5px;background:#e9edf3;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.bar2.full i{background:var(--ok)}
.st{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.go{background:#eaf0fb;color:#1d4ed8}
.st.no{background:#f0f2f5;color:var(--text2)}
.need{font-weight:700;color:var(--dang)}
.need.z{color:#c8cfd9;font-weight:400}
.empty{padding:60px;text-align:center;color:var(--text2)}

/* 상세 */
.ovl{position:fixed;inset:0;background:rgba(11,31,58,.3);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;width:min(580px,95vw);height:100vh;background:#fff;z-index:80;
box-shadow:-6px 0 30px rgba(11,31,58,.18);transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.dw.on{transform:none}
.dwh{background:var(--navy);color:#fff;padding:17px 22px;display:flex;align-items:flex-start;gap:10px}
.dwh h3{font-size:19px;font-weight:700}
.dwh .s{font-size:12px;opacity:.8;margin-top:4px}
.dwh .x{margin-left:auto;background:none;border:none;color:#fff;font-size:23px;cursor:pointer;opacity:.75;line-height:1}
.dwb{padding:20px 22px 50px;overflow:auto;flex:1}
.sec{font-size:12px;font-weight:700;color:var(--navy);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec:first-child{margin-top:0}
.arow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow .an{width:88px;color:var(--text2);font-size:12px}
.arow .ab{flex:1;height:6px;background:#e9edf3;border-radius:3px;overflow:hidden}
.arow .ab i{display:block;height:100%;background:var(--accent)}
.arow .ab.full i{background:var(--ok)}
.arow .av{width:46px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ct{width:100%;border-collapse:collapse;font-size:12.5px}
.ct th{background:#f7f9fc;color:var(--text2);font-weight:600;padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);font-size:11px}
.ct td{padding:7px 9px;border-bottom:1px solid var(--line)}
.ct td.c{text-align:center;width:30px}
.ct tr.dn td{background:#fbfdfc}
.ct .code{font-size:10.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.gh{background:#f2f5f9;font-size:11px;font-weight:700;color:var(--navy)}
.gh td{padding:6px 9px}
.gh .r{float:right;font-weight:700}
.gh .r.y{color:var(--ok)} .gh .r.n{color:var(--dang)}
.mk{color:var(--ok);font-weight:700}
.note{background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:12px 14px;
font-size:12px;line-height:1.7;color:var(--text2);margin-top:14px}
.note b{color:var(--navy)}
.note.w{background:var(--warnbg);border-color:#eddfbe;color:#6b5320}
.kiat{background:#1e2936;color:#a8d8a8;font-family:Consolas,monospace;font-size:11.5px;padding:12px;
border-radius:8px;white-space:pre-wrap;max-height:180px;overflow:auto;line-height:1.6;margin-top:8px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.act{flex-wrap:wrap}.act .who{min-width:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* 상단 현황판 */
.board{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px}
.bd{width:100%;border-collapse:collapse;font-size:13px}
.bd thead th{background:#f7f9fc;color:var(--text2);font-weight:600;font-size:11.5px;padding:9px 12px;
border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.bd thead th.l{text-align:left}
.bd tbody td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);
font-variant-numeric:tabular-nums;font-weight:600}
.bd tbody td.l{text-align:left;font-weight:400}
.bd tbody tr{cursor:pointer}
.bd tbody tr:hover td{background:#fafbfd}
.bd tbody tr.on td{background:#eef4ff}
.bd tbody tr.off td{color:var(--text3)}
.bd tbody tr.sm td{background:#f7f9fc;border-top:1px solid var(--border);border-bottom:none}
.bd tbody tr.sm.on td{background:#eef4ff}
.bd td.g{color:var(--ok)} .bd td.o{color:#b45309} .bd td.r{color:var(--dang)} .bd td.z{color:var(--text3);font-weight:400}
.lack{font-size:10.5px;color:var(--dang);margin-top:3px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 8px 96px}
.chip{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text2)}
.chip.y{background:var(--okbg);border-color:#cfe7d6;color:var(--ok)}
.chip.n{background:var(--dangbg);border-color:#f0cccc;color:var(--dang);font-weight:600}

.bd td.kx{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.bd td.kx:hover{background:#eef4ff!important}
.hintx{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px}
.bd tbody tr.all td{background:var(--navy);color:#fff;border-bottom:none}
.bd tbody tr.all td.g{color:#8fe3ad} .bd tbody tr.all td.z{color:#7f8ea3}
.bd tbody tr.all .hintx{color:#9fb0c4}
.bd tbody tr.all.on td{background:#17335a}
.jump{display:flex;gap:8px;align-items:center;padding:12px 16px;background:#f4f7fb;border-bottom:1px solid var(--border);flex-wrap:wrap}
.jump label{font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.jump input{padding:8px 11px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:14px;
  background:#fff;color:var(--text);outline:none;width:190px;letter-spacing:.02em}
.jump input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,56,100,.1)}
.jump .msg{font-size:12px;color:var(--dang)}
.jump .tip{font-size:11px;color:var(--text3);margin-left:auto}
.et{width:100%;border-collapse:collapse;font-size:13px}
.et td{padding:6px 0;border-bottom:1px solid var(--border);vertical-align:top}
.et tr:last-child td{border-bottom:none}
.et td.k{width:96px;color:var(--text2);white-space:nowrap;padding-right:10px}
.et td.v{color:var(--text)}
.et td.v.no{color:var(--text3)}
.warnbox{background:var(--dangbg);border:1px solid #f0cccc;border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--dang);line-height:1.7;margin:10px 0 0}
.nodata{font-size:12.5px;color:var(--text3);padding:10px 0;line-height:1.7}
.ct .tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;padding:1px 6px;
  border-radius:4px;background:#eef4ff;color:#1d4ed8;border:1px solid #d6e4ff;white-space:nowrap}
.leg{font-size:11px;color:var(--text3);margin:-4px 0 8px;line-height:1.7}
</style>
</head>
<body>
<div class="top"><span class="badge">관리자</span><h1>이수 현황 관리 · 차세대반도체 융합전공</h1>
<span class="meta" id="meta"></span>
<nav class="topnav">
  <a href="admin.html" class="tnav">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="1.5" width="9" height="9" rx="1.8" stroke="currentColor" stroke-width="1.4"/><path d="M6 3.5v5M3.5 6h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    성적 입력
  </a>
  <a href="portal_survey.html" class="tnav hub">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 5.5L6 2l4 3.5V10a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 2 10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    데이터허브
  </a>
</nav></div>

<div id="gate" style="max-width:420px;margin:80px auto;padding:34px 30px;background:#fff;
border:1px solid var(--border);border-radius:14px;text-align:center;display:none">
  <div style="font-size:30px;margin-bottom:12px">🔒</div>
  <h2 style="font-size:17px;font-weight:700;color:var(--navy)">관리자 권한이 필요합니다</h2>
  <p style="font-size:13px;color:var(--text2);margin-top:8px;line-height:1.7" id="gateMsg">
    데이터허브에 관리자 계정으로 로그인한 뒤 이용하세요.</p>
  <a href="portal_survey.html" style="display:inline-block;margin-top:18px;padding:9px 20px;
    background:var(--navy);color:#fff;text-decoration:none;border-radius:8px;font-size:13px">데이터허브로 이동</a>
</div>

<div id="loading" style="max-width:420px;margin:100px auto;text-align:center;color:var(--text2)">
  <div style="width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px"></div>
  <div style="font-size:13px">이수현황을 불러오는 중...</div>
</div>
<style>@keyframes sp{to{transform:rotate(360deg)}}</style>

<div class="wrap" id="wrap" style="display:none">
  <div class="board" id="board"></div>
  <div class="tabs">
    <button class="tab on" id="t0" onclick="go(0)">조치 필요 <span class="c" id="c0"></span></button>
    <button class="tab" id="t1" onclick="go(1)">전체 명단 <span class="c" id="c1"></span></button>
  </div>
  <div class="panel">
    <div class="jump">
      <label for="jS">학번 조회</label>
      <input id="jS" placeholder="예: 2022170155" autocomplete="off" inputmode="numeric">
      <button class="btn p" onclick="jump()">조회</button>
      <span class="msg" id="jMsg"></span>
      <span class="tip">학번을 넣고 Enter — 학생 상세가 바로 열립니다</span>
    </div>
    <div class="bar">
      <select id="fD"><option value="">전체 학과</option></select>
      <select id="fY"><option value="">전체 학년</option></select>
      <select id="fS"><option value="">재학·휴학·유예·수료</option><option value="재학">재학</option>
      <option value="휴학">휴학</option><option value="수강유예">수강유예</option>
      <option value="미수강유예">미수강유예</option><option value="수료">수료</option>
      <option value="졸업">졸업</option><option value="융전포기">융전포기</option>
      <option value="_all">전체 155명</option></select>
      <input class="q" id="fQ" placeholder="이름 · 학번 · 순번 검색">
      <button class="btn" onclick="reset_()">초기화</button>
      <button class="btn p" onclick="csv()">엑셀 내려받기</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div id="body"></div>
  </div>
</div>

<div class="ovl" id="ovl" onclick="close_()"></div>
<aside class="dw" id="dw"><div class="dwh"><div><h3 id="dN"></h3><div class="s" id="dS"></div></div>
<button class="x" onclick="close_()">×</button></div><div class="dwb" id="dB"></div></aside>

<script>

    const t = setTimeout(() => { cleanup(); reject(new Error('응답 시간 초과')); }, 30000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if(sc.parentNode) sc.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    const q = Object.entries({...params, callback: cb})
      .map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    const sc = document.createElement('script');
    sc.src = EXEC_URL + '?' + q;
    sc.onerror = () => { cleanup(); reject(new Error('네트워크 오류')); };
    document.head.appendChild(sc);
  });
}

function shape(r){
  const ar = {트랙:r.area.track, 공동:r.area.joint, 산학:r.area.industry,
              자유:r.area.free, 학부:r.area.recog};
  const tk = r.codes || [];
  const has = c => tk.includes(c);
  const wish = r.wishCodes || [];
  const w26 = {};
  OPEN.forEach(([c]) => {
    w26[c] = has(c) ? '✅ 이수완료' : wish.includes(c) ? '📝 신청함'
           : satisfied(c, r, ar) ? '➖ 대체충족' : '❗ 미이수·미신청';
  });
  const DK = {'신소재공학부':'mseng','전기전자공학부':'ee','화공생명공학과':'cbe',
              '기계공학부':'me','물리학과':'phys'};
  return {
    sid:r.sid, name:r.name, dept:r.dept, yr:r.year, st:r.status, seq:r.seq,
    cohort:r.cohort, tot:r.total, ar,
    ok:{트랙:ar.트랙>=12, 공동:ar.공동>=6, 산학:ar.산학>=6, 자유:ar.자유>=6, 학부:ar.학부>=6},
    tr:{소자:r.tracks.소자==='O', 공정:r.tracks.공정==='O',
        소재:r.tracks.소재==='O', 패키징:r.tracks.패키징==='O'},
    ai:r.required==='이수', nw:wish.length, w26,
    dk:DK[r.dept]||'mseng', tk,
    crs:(r.semesters||[]).map(x => { const [c,s]=x.split(':'); return {c, s, n:c, ym:''}; }),
    source:r.source, updated:r.updated, memo:r.memo,
    en:r.enroll||null
  };
}
// 대체충족 = 그 영역이 다른 과목으로 이미 채워져 수강할 필요가 없는 상태.
// 산학연계는 PBL 1 + 콜로키움 1 조합이므로 종류별로 따로 본다.
function satisfied(code, r, ar){
  const has = c => (r.codes||[]).includes(c);
  if(code==='KISE302') return r.required==='이수';
  if(code==='KISE408') return has('KISE407') || has('KISE408');
  if(code==='KISE410') return has('KISE409') || has('KISE410');
  const T={KISE304:'소재',KISE306:'패키징',KISE402:'공정',KISE404:'소자'};
  return r.tracks[T[code]]==='O';
}

function diag(d){
  const need=OPEN.filter(([c])=>d.w26[c].startsWith('❗')).map(([,n])=>n);
  const wish=OPEN.filter(([c])=>d.w26[c].startsWith('📝')).length;
  const r={need,wish,active:!INACT.includes(d.st),sev:0,rsn:'',hint:''};
  if(d.st==='졸업'||d.st==='융전포기'){r.rsn=d.st;return r;}
  if(!r.active){r.rsn=d.st+' — 이번 학기 수강신청 불가';return r;}
  if(d.tot>=36){r.rsn='졸업요건 36학점 충족';return r;}
  if(!d.ai&&d.yr>=3&&!d.w26['KISE302'].startsWith('📝')){
    r.sev=1; r.rsn='<b>AI반도체개론(전공필수) 미이수</b> · 이번 학기 미신청';
    r.hint=`${d.yr}학년 · 남은 학점 ${36-d.tot} · 미이수 요건 ${need.length}과목`;
    return r;
  }
  if(d.yr>=3&&wish===0&&need.length){
    r.sev=2; r.rsn='이번 학기 <b>수강희망 등록 없음</b>';
    r.hint=`미이수 요건 ${need.length}과목 — ${need.slice(0,3).join(' · ')}${need.length>3?' 외':''}`;
    return r;
  }
  if(d.yr>=3&&need.length){
    r.sev=2; r.rsn=`미이수 요건 <b>${need.length}과목</b>을 이번 학기에 담지 않음`;
    r.hint=`미신청 — ${need.join(' · ')}`;
    return r;
  }
  r.rsn = d.yr<=2 ? '2학년 — 이수 시작 전' : '이번 학기 필요한 과목을 모두 신청';
  return r;
}

  // 융전포기는 학적이 아니라 융합전공 상태다. 재적생목록과 달라도 정상.
  if(e.status && d.st!=='융전포기' && e.status!==d.st)
    w.push(`학적상태가 다릅니다 — 이수현황 <b>${esc(d.st)}</b> · 재적 <b>${esc(e.status)}</b>`);
  if(e.year && d.yr && Number(e.year)!==Number(d.yr))
    w.push(`학년 기준이 다릅니다 — 이수현황 <b>${d.yr}학년</b>(2026-2 가진급) · 재적 <b>${e.year}학년</b>(2026-1). 둘 다 맞습니다.`);

  const v=(x,suf)=>x===null||x===undefined||x===''?'<span class="no">—</span>':esc(String(x))+(suf||'');
  const gpa=[e.gpaAll!=null?'전체 '+e.gpaAll:'', e.gpaMajor!=null?'전공 '+e.gpaMajor:'']
            .filter(Boolean).join('  ·  ');
  return `<div class="sec">재적 정보 <span class="hintx">학사시스템 재적생목록 · ${esc(e.updated||'')}</span></div>
  <table class="et"><tbody>
    <tr><td class="k">학적</td><td class="v">${v(e.status)}${e.changeDate?` <span class="hintx">변동 ${esc(e.changeDate)}${e.changeCode?' ('+esc(e.changeCode)+')':''}</span>`:''}</td></tr>
    <tr><td class="k">등록</td><td class="v">${v(e.reg)}${e.regCount!=null?` <span class="hintx">${e.regCount}회</span>`:''}</td></tr>
    <tr><td class="k">학년</td><td class="v">${v(e.year,'학년')} <span class="hintx">2026-1 기준</span></td></tr>
    <tr><td class="k">입학</td><td class="v">${v(e.admit)}</td></tr>
    <tr><td class="k">취득학점</td><td class="v">${v(e.credits)} <span class="hintx">졸업 기준 전체 학점</span></td></tr>
    <tr><td class="k">평점</td><td class="v">${gpa?esc(gpa):'<span class="no">—</span>'}</td></tr>
    <tr><td class="k">지도교수</td><td class="v">${v(e.advisor)}</td></tr>
  </tbody></table>
  ${w.length?`<div class="warnbox">${w.join('<br>')}</div>`:''}`;
}

function jump(){
  const v=(jS.value||'').trim(); jMsg.textContent='';
  if(!v){ jS.focus(); return; }
  let hit=DATA.filter(d=>d.sid===v);
  if(!hit.length) hit=DATA.filter(d=>String(d.seq)===v);
  if(!hit.length) hit=DATA.filter(d=>d.name===v);
  if(!hit.length){ jMsg.textContent='이수현황에 없는 학번입니다. 졸업생이거나 융합전공생이 아닐 수 있습니다.'; return; }
  if(hit.length>1){ jMsg.textContent=`같은 이름 ${hit.length}명 — 학번으로 조회하세요.`; fQ.value=v; render(); return; }
  open_(hit[0].sid);
}
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('jS'); if(el) el.addEventListener('keydown',e=>{if(e.key==='Enter')jump();});
});
function close_(){dw.classList.remove('on');ovl.classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_();});

function csv(){
  const L=rows();
  const h=['순번','학번','이름','학과','학년','학적상태','총학점','졸업요건',
    ...AREAS.map(a=>a[2]),'2026-2 신청건수','추가 필요 과목수','조치 사유'];
  const b=L.map(d=>[d.seq,d.sid,d.name,d.dept,d.yr,d.st,d.tot,d.tot>=36?'충족':'미충족',
    ...AREAS.map(a=>d.ar[a[0]]),d.nw,d.dg.need.length,d.dg.rsn.replace(/<[^>]+>/g,'')]);
  const t=[h,...b].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv;charset=utf-8'}));
  a.download='차반융_이수현황_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
boot();
</script>
